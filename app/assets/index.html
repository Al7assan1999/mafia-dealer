<style>
/* ===== fonts (bundled, offline) ===== */

@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format('woff2');font-weight:400;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format('woff2');font-weight:600 900;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Elite;src:url(fonts/special-elite-latin-400-normal.woff2) format('woff2');font-weight:400 900;unicode-range:U+0000-00FF,U+2000-206F}

@font-face{font-family:Readex;src:url(fonts/readex-pro-latin-400-normal.woff2) format('woff2');font-weight:400;unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Readex;src:url(fonts/readex-pro-latin-700-normal.woff2) format('woff2');font-weight:600 900;unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Readex;src:url(fonts/readex-pro-arabic-400-normal.woff2) format('woff2');font-weight:400;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Readex;src:url(fonts/readex-pro-arabic-700-normal.woff2) format('woff2');font-weight:600 900;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}

/* ===== theme tokens: Neon (default) ===== */
:root{
  --font:Readex,system-ui,sans-serif; --head:Readex,system-ui,sans-serif; --head-w:700; --head-ls:0; --cap-ls:.12em;
  --bg:#0b0a10; --bg2:#ffffff08; --card:#ffffff0b; --card2:#ffffff12; --line:#ffffff17; --line2:#ffffff2a;
  --text:#f4f2f8; --mute:#a59fb3; --dim:#6f6880;
  --red:#ff2e63; --red2:#ff5c84; --gold:#ffb547; --green:#3ce0a0; --blue:#5aa2ff; --sel:#ff2e63; --selbg:#ff2e631c;
  --pri:linear-gradient(135deg,#ff2e63,#ff6a3d); --pri-t:#fff; --pri-sh:0 10px 26px #ff2e6345;
  --alt:linear-gradient(135deg,#ffb547,#ff7a3d); --alt-t:#1d1206; --alt-sh:0 10px 26px #ff8a3d38;
  --r:22px; --rs:16px; --rx:12px; --blur:blur(12px);
  --bgfx:radial-gradient(60% 35% at 8% -6%,#ff2e6344,transparent 70%),radial-gradient(55% 32% at 104% 12%,#3d6bff30,transparent 70%),linear-gradient(170deg,#17131f,#0b0a10 60%);
  --bg-night:radial-gradient(70% 45% at 50% -8%,#2a3aa0aa,transparent 70%),linear-gradient(175deg,#0f1433,#06070f 65%);
  --bg-day:radial-gradient(70% 45% at 50% -8%,#ff9a3d66,transparent 70%),linear-gradient(175deg,#2a1a12,#0d0a08 65%);
  --bg-blood:radial-gradient(75% 50% at 50% -8%,#ff2e6366,transparent 70%),linear-gradient(175deg,#2a0b16,#0b0508 65%);
  --bg-glory:radial-gradient(75% 50% at 50% -8%,#ffb54766,transparent 70%),linear-gradient(175deg,#2a2010,#0d0a05 65%);
  --mark:linear-gradient(135deg,#ff2e63,#ff8a3d); --mark-sh:0 12px 30px #ff2e6350;
}
/* ===== Noir ===== */
[data-theme=noir]{
  --font:Plex,system-ui,sans-serif; --head:Elite,Messiri,serif; --head-w:400; --head-ls:.02em; --cap-ls:.16em;
  --bg:#0d0c0b; --bg2:#151311; --card:#191714; --card2:#23201c; --line:#36312a; --line2:#4a433a;
  --text:#ece4d4; --mute:#a39a8b; --dim:#6f675b;
  --red:#b3241f; --red2:#e0574d; --gold:#d4b483; --green:#7fb08b; --blue:#86a6c9; --sel:#c4302a; --selbg:#3a1512;
  --pri:#b3241f; --pri-t:#f6efe2; --pri-sh:3px 3px 0 #000;
  --alt:#e9e1d1; --alt-t:#1c1915; --alt-sh:3px 3px 0 #b3241f;
  --r:4px; --rs:3px; --rx:2px; --blur:none;
  --bgfx:radial-gradient(90% 45% at 50% -8%,#4a0f0f66,transparent 70%),repeating-linear-gradient(0deg,#ffffff04 0 2px,transparent 2px 4px),#0d0c0b;
  --bg-night:radial-gradient(90% 45% at 50% -8%,#14213d99,transparent 70%),repeating-linear-gradient(0deg,#ffffff03 0 2px,transparent 2px 4px),#08090c;
  --bg-day:radial-gradient(90% 45% at 50% -8%,#5a4426aa,transparent 70%),repeating-linear-gradient(0deg,#ffffff04 0 2px,transparent 2px 4px),#120f0b;
  --bg-blood:radial-gradient(90% 50% at 50% -8%,#6b0f0faa,transparent 70%),repeating-linear-gradient(0deg,#ffffff03 0 2px,transparent 2px 4px),#0c0606;
  --bg-glory:radial-gradient(90% 50% at 50% -8%,#5a4a1eaa,transparent 70%),repeating-linear-gradient(0deg,#ffffff04 0 2px,transparent 2px 4px),#0e0c06;
  --mark:none; --mark-sh:none;
}

/* ===== base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;min-height:100%}
body{background:var(--bgfx) fixed;padding:16px 16px 92px;user-select:none;-webkit-user-select:none;transition:background 1.2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.h,.brand b,.hero h1,.act h2,.who,.res,.victim,.rv .rn,.tile b,.mode b,.ttl.wide b,.timer .t{font-family:var(--head);font-weight:var(--head-w);letter-spacing:var(--head-ls)}

/* header */
.top{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:22px;line-height:1.2}.brand span{font-size:12.5px;color:var(--mute)}
.pill{height:40px;min-width:40px;padding:0 14px;border-radius:var(--rx);background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;backdrop-filter:var(--blur)}
.top .pill:first-child{font-size:22px;line-height:1;padding:0}
[dir=rtl] .top .pill:first-child{transform:scaleX(-1)}

/* cards and sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;backdrop-filter:var(--blur)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sh h3{font-size:13px;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--mute);font-weight:700}
.link{color:var(--gold);font-weight:700;font-size:14px;padding:6px 2px}.ver{display:block;margin:20px auto 0;text-align:center;color:var(--dim);font-size:12.5px;padding:8px 12px}
.banner.upd small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}.banner.upd .btn{width:auto;min-height:40px;padding:8px 16px;font-size:14.5px}
.rsum{position:relative;display:block;width:100%;text-align:start;padding-inline-end:40px}.rsum .chips{margin:0}.rsum .chipb{height:28px;font-size:12px;display:inline-flex;align-items:center;cursor:default}
.rsum .go,.wide .go{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--mute)}[dir=rtl] .rsum .go,[dir=rtl] .wide .go{transform:translateY(-50%) scaleX(-1)}
.rec{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-top:4px;border-radius:var(--rs);border:1px dashed color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold);font-size:13.5px;text-align:start}
.rec svg{width:18px;height:18px;flex:none}.rec span{flex:1}.rec b{font-size:13px}
.preset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.preset button{padding:12px 10px;border-radius:var(--rs);background:var(--card);border:1.5px solid var(--line);text-align:start;display:flex;flex-direction:column;gap:3px;backdrop-filter:var(--blur)}
.preset button b{font-size:15px}.preset button small{font-size:12.5px;color:var(--mute);line-height:1.35}.preset button.on{border-color:var(--sel);background:var(--selbg)}.preset button:disabled{cursor:default}
.rgrp .sh h3{display:flex;align-items:center;gap:8px}.gi{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--rx);background:var(--card2);color:var(--gold)}.gi svg{width:15px;height:15px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:3px;gap:3px;flex:none}.rgrp>.seg{margin:2px 0 8px}
.seg button{padding:8px 12px;border-radius:var(--rx);font-size:13.5px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--sel);color:#fff}
.tg.vol input{flex:1;min-width:0;accent-color:var(--sel);height:28px}.vv{font-size:13px;color:var(--mute);min-width:40px;text-align:end;font-variant-numeric:tabular-nums}
.tg.wide{width:100%;position:relative;text-align:start}
.mini{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mute);margin-inline-start:6px}.mini.bad{color:var(--red2);border-color:color-mix(in srgb,var(--red2) 45%,transparent)}
[data-theme=noir] .mini{border-radius:2px}.btn svg{width:20px;height:20px}
.ptimer{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px 16px;margin-bottom:12px}
.ptimer b{font-family:var(--head);font-size:34px;direction:ltr;font-variant-numeric:tabular-nums}.ptimer b.low{color:var(--red2)}
.pfab{position:fixed;top:14px;inset-inline-end:14px;z-index:6;width:44px;height:44px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--text);backdrop-filter:var(--blur)}.pfab svg{width:22px;height:22px}
[data-theme=noir] .pfab{border-radius:4px}
.sec.ghost{text-align:start;margin:14px 0 4px;border-style:dashed}.sec.ghost h3{display:flex;align-items:center;gap:6px}.sec.ghost h3 svg{width:16px;height:16px}
.recap{position:relative;border-radius:calc(var(--r) + 6px);padding:18px;margin-top:6px;border:1px solid var(--line2);overflow:hidden;
 background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),var(--card)}
.recap.mafia{background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--red2) 26%,transparent),transparent 70%),var(--card)}
[data-theme=noir] .recap{background:var(--alt);color:var(--alt-t);border:0;box-shadow:4px 4px 0 var(--red)}
.rc-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}[data-theme=noir] .rc-top{color:#5a5248}
.rc-brand{display:flex;align-items:center;gap:6px;font-family:var(--head);font-weight:var(--head-w);font-size:13.5px;color:var(--text)}[data-theme=noir] .rc-brand{color:var(--alt-t)}
.rc-brand i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--mark)}.rc-brand i svg{width:14px;height:14px}
[data-theme=noir] .rc-brand i{background:var(--red);border-radius:2px}
.rc-win{text-align:center;padding:14px 0 6px}.rc-win .orb{margin-bottom:10px;width:76px;height:76px}.rc-win .res{font-size:34px;margin:0;color:var(--gold)}.recap.mafia .rc-win .res{color:var(--red2)}
[data-theme=noir] .rc-win .res{color:var(--red)}[data-theme=noir] .rc-win .orb{background:none;border-color:#9a8f7c}
.rc-win p{color:var(--mute);font-size:13px;margin-top:4px}[data-theme=noir] .rc-win p{color:#5a5248}
.rc-mvp{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px;border-radius:var(--rs);background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.rc-mvp>i{color:var(--gold)}.rc-mvp>i svg{width:26px;height:26px}.rc-mvp div{flex:1;min-width:0}.rc-mvp small{display:block;font-size:12.5px;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--mute)}
.rc-mvp b{display:block;font-family:var(--head);font-weight:var(--head-w);font-size:21px}.rc-mvp span{font-size:12.5px;color:var(--mute)}.rc-mvp em{font-style:normal;font-weight:700;font-size:13px}
[data-theme=noir] .rc-mvp{background:#00000010;border-color:#9a8f7c}[data-theme=noir] .rc-mvp>i{color:var(--red)}[data-theme=noir] .rc-mvp small,[data-theme=noir] .rc-mvp span{color:#5a5248}
.rc-roles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.rc-roles span{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--rx);background:color-mix(in srgb,var(--rc) 12%,transparent);border-inline-start:3px solid var(--rc)}
.rc-roles b{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc-roles small{font-size:12px;font-weight:700;color:var(--rc)}.rc-roles .out b{text-decoration:line-through;opacity:.6}
.rc-tl{border-top:1px dashed var(--line2);padding-top:10px;margin-top:4px}.rc-tl div{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;margin:4px 0;color:var(--mute)}
[data-theme=noir] .rc-tl{border-color:#9a8f7c}[data-theme=noir] .rc-tl div{color:#3d362d}
.rc-tl i{flex:none;margin-top:2px}[data-theme=noir] .rc-roles small,[data-theme=noir] .rc-mvp em{filter:brightness(.62) saturate(1.3)}.rc-tl i svg{width:15px;height:15px}
.lb.tap{cursor:pointer}.lb.tap:active{background:var(--card2)}
.rbar{display:flex;align-items:center;gap:10px;margin:8px 0}.rbar b{width:84px;font-size:14px}.rbar div{flex:1;height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px}.rbar span{font-size:13px;color:var(--mute);min-width:38px;text-align:end}
.pstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.pstat span{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}.pstat b{font-family:var(--head);font-size:24px;color:var(--text)}
.form{display:flex;gap:6px;flex-wrap:wrap}.form span{width:34px;height:34px;border-radius:var(--rx);display:grid;place-items:center;font-weight:800;font-size:13px}
.form .w{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}.form .l{background:color-mix(in srgb,var(--red2) 18%,transparent);color:var(--red2)}
.intro{position:fixed;inset:0;z-index:40;background:var(--bgfx),var(--bg);display:flex;flex-direction:column;justify-content:center;padding:28px 22px;text-align:center}
.intro .icard{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.intro .iorb{width:110px;height:110px;margin:0 auto 22px;border-radius:32px;display:grid;place-items:center;background:var(--mark);box-shadow:var(--mark-sh);color:#fff}.intro .iorb svg{width:54px;height:54px}
[data-theme=noir] .intro .iorb{background:none;border:2px solid var(--red);color:var(--red);border-radius:6px;transform:rotate(-4deg)}
.intro h2{font-size:30px;margin-bottom:10px}.intro p{color:var(--mute);font-size:16px;line-height:1.6;margin-bottom:34px}
.idots{display:flex;gap:8px;justify-content:center;margin-bottom:34px}.idots i{width:8px;height:8px;border-radius:99px;background:var(--line2);transition:.3s}.idots i.on{width:26px;background:var(--sel)}
.gcode{text-align:center;font-size:30px;letter-spacing:5px}
.pbar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:14px}.pbar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .2s}
.avt{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle}.avt img{width:100%;height:100%;object-fit:cover}.avt svg{width:58%;height:58%}
[data-theme=noir] .avt{border-radius:4px}.ib.acc{padding:0;overflow:hidden}.ib.acc .avt{width:100%!important;height:100%!important;border-radius:inherit}
.prs .avt{margin-inline-end:2px}.meline{display:flex;align-items:center;gap:12px}.meline b{display:block;font-size:17px}.meline small{color:var(--mute);font-size:12.5px}
.pro .pav{display:flex;justify-content:center;margin-bottom:10px}.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;margin-bottom:6px}
.avgrid button,.avup{display:grid;place-items:center;padding:4px;min-width:0;min-height:50px;border-radius:var(--rs);border:1.5px solid transparent;background:var(--bg2)}.avgrid button.on{border-color:var(--sel)}
.avup{flex-direction:column;gap:2px;font-size:10.5px;color:var(--mute);cursor:pointer;text-align:center}.avup svg{width:18px;height:18px}
.seg.wide2{display:flex}.seg.wide2 button{flex:1;padding:10px}
.link.discard{display:block;margin:4px auto 12px;color:var(--mute);padding:8px 16px}
.flbl{font-size:12.5px;letter-spacing:var(--cap-ls);text-transform:uppercase;color:var(--mute);font-weight:700;margin:6px 2px 7px}
.search,.prow input{width:100%;height:48px;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--line);padding:0 14px;outline:none;margin-bottom:10px}
.search:focus,.prow input:focus{border-color:var(--sel)}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.prow input{flex:1;min-width:0;margin:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute);flex:none}
[data-theme=noir] .num{border-radius:2px}
.x{width:44px;height:44px;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--line);color:var(--mute);font-size:20px;flex:none}
.role{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--rs);background:var(--bg2);border:1px solid var(--line);margin-bottom:8px}
.ric{width:42px;height:42px;border-radius:var(--rs);display:grid;place-items:center;flex:none}.ric svg{width:22px;height:22px}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:16px}.rt span{font-size:13.5px;color:var(--mute);line-height:1.4;display:block}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:36px;height:36px;border-radius:var(--rx);background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:700}
.step i{font-style:normal;width:22px;text-align:center;font-weight:800;font-size:17px}
.auto{font-size:12px;color:var(--dim);font-weight:600;padding:0 4px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px}[data-theme=noir] .badge{border-radius:2px}
.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.bad{background:color-mix(in srgb,var(--red2) 16%,transparent);color:var(--red2)}
.tg{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}.tg:last-child{border-bottom:0}.tg .rt b{font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.2s}
.sw.on{background:var(--sel);border-color:var(--sel)}.sw.on:after{inset-inline-start:23px;background:#fff}
[data-theme=noir] .sw,[data-theme=noir] .sw:after{border-radius:2px}

/* buttons */
.cta{position:fixed;left:16px;right:16px;bottom:16px;z-index:5}
.btn{width:100%;min-height:56px;border-radius:var(--rs);font-weight:700;font-size:17px;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.primary{background:var(--pri);color:var(--pri-t);box-shadow:var(--pri-sh)}

.chipb.on{background:var(--selbg);border-color:var(--sel);color:var(--text)}
.gcard{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:13px 14px;margin-bottom:8px}
.gcard.inv{opacity:.5}.gcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}

.tagi{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:#ffffff14;color:var(--mute);margin-inline-start:6px}
.empty{text-align:center;color:var(--mute);padding:40px 20px;font-size:14.5px;line-height:1.6}

.ttl{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:12px}
.ttl.wide{grid-column:1/3;border-color:color-mix(in srgb,var(--gold) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 12%,transparent),var(--card))}

.guide p{color:color-mix(in srgb,var(--text) 82%,transparent);font-size:14.5px;line-height:1.7;margin-bottom:8px}.guide p:last-child{margin:0}.guide p b{color:var(--text)}

.prs b{flex:1;min-width:0;word-break:break-word}.prs small.oldv{color:var(--red2)}.prs small{color:var(--mute);font-size:13px;font-weight:700}

/* phase backgrounds + stars */
body.night{background:var(--bg-night) fixed}body.day{background:var(--bg-day) fixed}body.blood{background:var(--bg-blood) fixed}body.glory{background:var(--bg-glory) fixed}
.sky{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:0;
 background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 42%,#cfd8ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 44% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 61% 30%,#cfd8ff 50%,transparent 51%),radial-gradient(2px 2px at 78% 16%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 38%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 8% 60%,#cfd8ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 35% 72%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 66%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 80%,#cfd8ff 50%,transparent 51%),radial-gradient(1px 1px at 52% 88%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 20% 90%,#fff 50%,transparent 51%);
 animation:twinkle 4s ease-in-out infinite alternate}
body.night .sky{opacity:1}[data-theme=noir] body.night .sky{opacity:.45}
#app{position:relative;z-index:1}
@keyframes twinkle{from{filter:brightness(.6)}to{filter:brightness(1.3)}}

@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}

.pulse{animation:pulse 1.6s ease-in-out infinite}
.dots{letter-spacing:6px;font-size:26px;animation:blink 1.4s infinite;margin-bottom:10px}

function popNav(){if(V==='rules'||V==='settings'){V=navRet;render();return;}if(V==='forgot'){V='account';render();return;}if(V==='account'){V=navRet;render();return;}if(V==='profile'){V='stats';render();return;}const was=MP.online?'online':'wifi';if(V==='host')hostStop();if(V==='join')clientStop(true);
V=V.indexOf('game:')===0?'history':(V==='host'||V==='join')?was:(V==='wifi'||V==='online')?'mp':'home';render();window.scrollTo(0,0);}
function back(){const v=V;try{history.back();}catch(e){}setTimeout(()=>{if(V===v&&!G&&!inRoom())popNav();},300);}

const inRoom=()=>(V==='host'&&MP.role==='host')||(V==='join'&&MP.role==='client'&&['ok','lost','joining','search'].includes(MP.status));

/* ---------- sound engine (all procedural, no audio files) ---------- */
const SND=(()=>{
 let C=null,M=null,R=null,NB=null,E=null;
 function ac(){
  if(!C){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;C=new A();
   M=C.createGain();M.gain.value=0.9;const comp=C.createDynamicsCompressor();M.connect(comp);comp.connect(C.destination);
   E=C.createGain();E.connect(M);  // effects bus: S.vol.sfx
   R=C.createConvolver();R.buffer=impulse(3.2,2.4);const rg=C.createGain();rg.gain.value=0.55;R.connect(rg);rg.connect(E);}
  if(C.state==='suspended')C.resume();return C;}
 function impulse(sec,decay){const n=Math.floor(C.sampleRate*sec),b=C.createBuffer(2,n,C.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
 function noise(){if(!NB){NB=C.createBuffer(1,C.sampleRate*2,C.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=C.createBufferSource();s.buffer=NB;s.loop=true;s.loopStart=Math.random();return s;}
 function out(node,wet){node.connect(E);if(wet){const g=C.createGain();g.gain.value=wet;node.connect(g);g.connect(R);}}
 function env(g,t,a,peak,hold,rel){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);}
 function osc(type,f,t,stop){const o=C.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(stop);return o;}
 function tone(type,f,t,a,peak,rel,wet,filt){const o=osc(type,f,t,t+a+rel+0.1),g=C.createGain();
  if(filt){const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=filt;o.connect(lp);lp.connect(g);}else o.connect(g);
  env(g,t,a,peak,0,rel);out(g,wet);return o;}
 function burst(t,type,freq,q,peak,rel,wet){const s=noise(),f=C.createBiquadFilter(),g=C.createGain();f.type=type;f.frequency.value=freq;f.Q.value=q;
  s.connect(f);f.connect(g);env(g,t,0.002,peak,0,rel);out(g,wet);s.start(t);s.stop(t+rel+0.05);}

 /* building blocks */
 function bell(t,f,vol){[[1,1,4],[2,.6,3],[2.4,.5,2.5],[3,.35,2],[4.2,.25,1.5],[5.4,.15,1]].forEach(([r,a,d])=>tone('sine',f*r,t,.005,vol*a,d,.9));}
 function drone(t,dur,f,vol){const lp=C.createBiquadFilter(),g=C.createGain();lp.type='lowpass';lp.Q.value=7;
  lp.frequency.setValueAtTime(120,t);lp.frequency.exponentialRampToValueAtTime(700,t+dur*.4);lp.frequency.exponentialRampToValueAtTime(140,t+dur);
  [[ 'sawtooth',f],['sawtooth',f*1.007],['sine',f/2],['sawtooth',f*1.498]].forEach(([ty,fr])=>osc(ty,fr,t,t+dur+.2).connect(lp));
  lp.connect(g);env(g,t,1.4,vol,Math.max(dur-3,.1),1.5);out(g,.5);}
 function whoosh(t,dur,f0,f1,vol){const s=noise(),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.Q.value=2.5;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);s.connect(f);f.connect(g);env(g,t,dur*.4,vol,0,dur*.6);out(g,.6);s.start(t);s.stop(t+dur+.1);}
 function growl(t,dur,vol){const sh=C.createWaveShaper(),curve=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;curve[i]=Math.tanh(9*x);}sh.curve=curve;
  const bp=C.createBiquadFilter(),g=C.createGain();bp.type='bandpass';bp.frequency.setValueAtTime(380,t);bp.frequency.linearRampToValueAtTime(260,t+dur);bp.Q.value=1.2;
  [62,93.5].forEach(fr=>{const o=osc('sawtooth',fr,t,t+dur+.2),l=osc('sine',6.5,t,t+dur+.2),lg=C.createGain();lg.gain.value=9;l.connect(lg);lg.connect(o.frequency);
   o.frequency.linearRampToValueAtTime(fr*.82,t+dur);o.connect(sh);});
  sh.connect(bp);bp.connect(g);env(g,t,.35,vol,dur-.9,.55);out(g,.7);}
 function chirp(t,f,len,vol){const o=osc('sine',f,t,t+len+.05),g=C.createGain();o.frequency.exponentialRampToValueAtTime(f*1.55,t+len*.55);
  o.frequency.exponentialRampToValueAtTime(f*1.05,t+len);o.connect(g);env(g,t,.006,vol,0,len);out(g,.35);}
 function whistle(t,f,vol){const o=osc('sine',f,t,t+.45),g=C.createGain();o.frequency.exponentialRampToValueAtTime(f*.66,t+.38);o.connect(g);env(g,t,.03,vol,.12,.25);out(g,.4);}
 function birds(t,dur){let x=t;while(x<t+dur){const n=2+Math.floor(Math.random()*4),f=2600+Math.random()*2200,sp=.07+Math.random()*.05;
   for(let k=0;k<n;k++)chirp(x+k*sp,f*(1+Math.random()*.08),.06+Math.random()*.04,.06+Math.random()*.06);
   if(Math.random()<.35)whistle(x+n*sp+.05,3000+Math.random()*900,.05);x+=.25+Math.random()*.45;}}

  seq.forEach(([f,d,l])=>{['sawtooth','square'].forEach((ty,i)=>tone(ty,f*(i?1.003:1),t+d,.03,i?.05:.09,l+.25,.4,2600));});
  [523.3,659.3,784,1046.5].forEach(f=>tone('sawtooth',f,t+1.08,.05,.04,2.2,.5,2200));}
 function crowd(t,dur,vol){[[1500,.7],[700,.9],[2600,1]].forEach(([fr,q])=>{const s=noise(),f=C.createBiquadFilter(),g=C.createGain();f.type='bandpass';f.frequency.value=fr;f.Q.value=q;s.connect(f);f.connect(g);

/* ---------- narrator (pre-recorded clips in audio.js) ---------- */
const VOX=(()=>{let tok=0,live=[];const cache={};
 function buf(k){const C=SND.ctx();if(!C||!k||!CLIPS[k])return Promise.resolve(null);if(cache[k])return Promise.resolve(cache[k]);
  const bin=atob(CLIPS[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Promise(r=>{try{C.decodeAudioData(u.buffer,x=>{cache[k]=x;r(x);},()=>r(null));}catch(e){r(null);}});}
 function stop(){tok++;live.forEach(x=>{try{x.stop();}catch(e){}});live=[];}
 function play(keys,delay,cb){stop();if(!(S.vol.voice>0))return;const C=SND.ctx();if(!C)return;const my=tok,t0=C.currentTime+(delay||0);
  Promise.all(keys.map(buf)).then(bs=>{if(my!==tok)return;let t=Math.max(t0,C.currentTime+.05);
   const marks=[];
   bs.forEach(x=>{marks.push(t-C.currentTime);if(!x)return;const s=C.createBufferSource(),g=C.createGain();g.gain.value=1.7*S.vol.voice;s.buffer=x;s.connect(g);g.connect(SND.out());s.start(t);live.push(s);t+=x.duration;});marks.push(t-C.currentTime);if(cb)cb(marks);});}
 function norm(n){return String(n).toLowerCase().trim().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[-'’.]/g,'').replace(/\s+/g,' ');}
 function name(n,mon){const k=norm(n),c=NAME_ALIAS[k]||NAME_ALIAS[k.split(' ')[0]]||null;if(!c||!mon)return c;const m='m_'+c.slice(2);return CLIPS[m]?m:c;}  // mon: monster voice
 return{play,stop,name};})();

function arm(sec){clearTimeout(revealTimer);revealTimer=setTimeout(revealNow,Math.max(sec,0)*1000);}
function revealNow(){clearTimeout(revealTimer);revealTimer=null;if(!G||G.revealed||!['morning','verdict','end'].includes(G.phase))return;
  G.revealed=true;if(G.mp)hostPublish();const bad=(G.phase==='morning'&&G.morning!=null)||(G.phase==='verdict'&&G.verdict.j!=null)||(G.phase==='end'&&G.winner==='mafia');
  try{navigator.vibrate&&navigator.vibrate(bad?[120,80,350]:60);}catch(e){}
  if(G.phase==='morning')SND.hit(G.morning!=null);else if(G.phase==='verdict'&&G.verdict.j!=null)SND.hit(true);save();render();}

function resolveNight(){
  // Mafia decision: most votes among living mafia; ties broken randomly
  const votes=Object.values(G.act.mafia);let target=null,skip=false;
  if(votes.length){
    const c={};votes.forEach(v=>{c[v]=(c[v]||0)+1;});
    const max=Math.max(...Object.values(c));const top=Object.keys(c).filter(k=>c[k]===max);
    const w=top[crypto.getRandomValues(new Uint32Array(1))[0]%top.length];
    if(w==='skip'){skip=true;G.skipUsed=true;}else target=+w;
  }
  const prot=new Set(Object.values(G.act.doctor).map(Number));
  G.lastProt=Object.assign({},G.act.doctor);
  let dead=null,h=t('h_night',{d:G.day});const parts=[];
  if(skip)parts.push(t('h_skip'));
  else if(target!=null){if(prot.has(target))parts.push(t('h_saved',{n:G.names[target]}));else{dead=target;G.alive[target]=false;parts.push(t('h_kill',{n:G.names[target]}));}}
  Object.values(G.act.detective).forEach(q=>parts.push(t('h_check',{n:G.names[q]})));
  G.hist.push(h+parts.join(' · '));
  G.ev=G.ev||{first:null,saves:[],caught:[]};
  G.lastTarget=target;G.savedP=(target!=null&&prot.has(target)&&S.rules.saverev)?target:null;
  if(target!=null&&prot.has(target))Object.entries(G.act.doctor).forEach(([p,q])=>{if(+q===target)G.ev.saves.push(+p);});
  if(dead!=null&&G.ev.first==null)G.ev.first=dead;
  if(dead!=null)(G.ev.kills=G.ev.kills||[]).push(dead);
  Object.entries(G.act.detective).forEach(([p,q])=>{if(G.roles[q]==='mafia'&&!G.ev.caught.includes(p+':'+q))G.ev.caught.push(p+':'+q);});
  G.morning=dead;
  if(checkWin(dead!=null?['v_killed_1',VOX.name(G.names[dead],1)]:[]))return;
  NARR.morning(dead!=null?G.names[dead]:null,dead!=null&&S.rules.reveal?G.roles[dead]:null,G.savedP!=null?G.names[G.savedP]:null);
  go('morning');
}

  }else{

function toggleTimer(){if(timer.run)stopTimer();else{timer.run=true;timer.at=Date.now();timer.h=setInterval(()=>{timer.at=Date.now();timer.left--;if(timer.left<=0){timer.left=0;stopTimer();alarm();NARR.timeUp();render();return;}upd();},1000);}render();}

function upd(){const e=$('tt');if(e){e.textContent=fmt(timer.left);e.classList.toggle('low',timer.left<=10);}}
function alarm(){try{navigator.vibrate&&navigator.vibrate([400,150,400]);}catch(e){}return;
  try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(s=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.25,A.currentTime+s);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+s+.3);o.start(A.currentTime+s);o.stop(A.currentTime+s+.3);});}catch(e){}}

function tallyVotes(ballots){
  const c={};Object.values(ballots).filter(v=>v!=='abstain'&&v!=null).forEach(v=>{c[v]=(c[v]||0)+1;});
  if(!Object.keys(c).length){applyVerdict(null,'skipped','');return;}
  const max=Math.max(...Object.values(c));const top=Object.keys(c).filter(k=>c[k]===max);
  const tally=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>(k==='none'?t('noOne'):G.names[k])+': '+v).join(' · ');
  if(top.length>1)applyVerdict(null,'tie',tally);else if(top[0]==='none')applyVerdict(null,'skipped',tally);else applyVerdict(+top[0],'out',tally);}

function mvp(g){const ev=g.ev||{},idx=g.names.map((n,i)=>i),top=a=>{const c={};(a||[]).forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).sort((x,y)=>y[1]-x[1])[0];};

    const maf=g.roles[i]==='mafia',w=won(g,i);p.g++;if(w)p.w++;if(maf){p.mg++;if(w)p.mw++;}else{p.tg++;if(w)p.tw++;}

function checkUpdate(force){const L=S.latest||{};if(!force&&Date.now()-(L.at||0)<6*3600e3)return Promise.resolve(S.latest);
  const c=new AbortController();setTimeout(()=>c.abort(),8000);
  return fetch(relayUrl().replace(/^ws/,'http')+'/version.json',{cache:'no-store',signal:c.signal}).then(r=>r.json()).then(j=>{
    if(j&&j.code){S.latest={code:j.code,name:j.name,url:j.url,notes:j.notes||'',at:Date.now()};save();if((V==='home'||V==='settings')&&!G)render();}return S.latest;}).catch(()=>null);}

/* in-app update: download with progress, hand the APK to the app (cache/update.apk), open Android's install screen.
   Android always asks "Update this app?" and only accepts an APK signed with the same key. Falls back to the browser. */
async function doUpdate(){const L=S.latest;if(!L||!/^https:\/\//.test(L.url))return;
  if(!(window.Net&&Net.saveApk&&Net.install)){openUrl(L.url);return;}
  const show=f=>{$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>${t('dlT',{v:esc(L.name)})}</h3><div class="pbar"><i style="width:${Math.round(f*100)}%"></i></div><p style="margin:8px 0 0">${f<1?Math.round(f*100)+'%':t('dlReady')}</p></div></div>`;};
  show(0);
  try{const r=await fetch(L.url,{cache:'no-store'});if(!r.ok)throw 0;const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0,last=0;
    for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(total&&got-last>65536){last=got;show(got/total);}}
    if(got<100000)throw 0;
    const buf=new Uint8Array(got);let o=0;for(const x of parts){buf.set(x,o);o+=x.length;}
    let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    show(1);if(!Net.saveApk(btoa(bin)))throw 0;
    setTimeout(()=>{$('modal').innerHTML='';Net.install();},400);
  }catch(e){$('modal').innerHTML='';toast(t('dlFail'));openUrl(L.url);}}
function openUrl(u){if(!/^https:\/\//.test(u))return;try{if(window.Net&&Net.open){Net.open(u);return;}}catch(e){}window.open(u,'_blank');}

 ['من يفوز',['<b>يفوز المواطنون</b> عندما يُقصى كل أفراد المافيا.','<b>تفوز المافيا</b> عندما يصبح عددها مساويًا لباقي اللاعبين الأحياء أو أكثر.']],
 ['الأدوار',['<b style="color:#ff4d63">المافيا</b> — يختارون كل ليلة لاعبًا لقتله. أفراد المافيا يعرفون بعضهم، وفي النهار يتظاهرون بالبراءة.','<b style="color:#3ccf91">الطبيب</b> — يختار كل ليلة لاعبًا لحمايته. إذا هاجمته المافيا ينجو. الطبيب مع المواطنين.','<b style="color:#5aa9ff">المحقق</b> — يفحص كل ليلة لاعبًا ويعرف سرًا إن كان مافيا أم لا. المحقق مع المواطنين.','<b style="color:#e8b65a">المواطن</b> — ليس له قدرة ليلية. سلاحه النقاش والتصويت.']],
 ['الليل',['يُمرَّر الهاتف حسب ترتيب الجلوس. كل لاعب حي يأخذ دوره سرًا ثم يمرره.','المافيا تختار الضحية، والطبيب يختار من يحمي، والمحقق يختار من يفحص. المواطنون أيضًا يضغطون على اسم حتى تبدو كل الأدوار متشابهة.','أخفِ الشاشة ولا تُظهر أي ردة فعل على ما تراه.']],
 ['النهار',['يوضع الهاتف في منتصف الطاولة ويعلن ما حدث في الليل.','يتناقش الجميع: من يتصرف بغرابة؟ من يكذب؟ المافيا ستحاول اتهام الأبرياء.','ثم تصوّت المدينة. يُقصى اللاعب صاحب أكثر الأصوات. يمكن تخطي التصويت، والتعادل لا يُقصي أحدًا.']],
 ['قواعد الطاولة',['اللاعبون المُقصَون يلتزمون الصمت، ولا يكشفون أدوارهم ولا يلمّحون.','لا تُرِ شاشتك لأحد ولا تنظر إلى دور لاعب آخر.','يمكنك ادعاء أي دور بصوت عالٍ، صدقًا أو كذبًا. الكذب جزء من اللعبة.']],
 ['خيارات التطبيق',['<b>المافيا تستطيع تخطي القتل</b> — مرة واحدة في اللعبة يمكن للمافيا ألا تقتل أحدًا، لإرباك المدينة مثلًا.','<b>منع تكرار الهدف</b> — المافيا لا تهاجم نفس اللاعب ليلتين متتاليتين. <b>إعلان من أنقذه الطبيب</b> — يذكر تقرير الصباح اسم من نجا من الهجوم.','<b>الطبيب يحمي نفسه</b> و<b>منع تكرار الحماية</b> — يغيّران قوة الطبيب.','<b>كشف الدور عند الإقصاء</b> — أوقفه للعبة أصعب لا تعرف فيها المدينة من خسرت.','<b>الاقتراع السري</b> — التصويت بتمرير الهاتف بدل رفع الأيدي.']],
 ['توزيع مقترح',['4–6 لاعبين: مافيا واحد، طبيب، ومحقق ابتداءً من 5 لاعبين.','7–9 لاعبين: 2 مافيا، طبيب، محقق.','10 أو أكثر: 3 مافيا، طبيب، محقق. القاعدة: مافيا واحد لكل 3–4 لاعبين تقريبًا.']],
 ['نصائح',['للمواطنين: راقبوا من يصوّت ضد من. أفراد المافيا قلّما يصوّتون ضد بعضهم.','للمحقق: لا تكشف نفسك مبكرًا، فالمافيا ستقتلك بعدها.','للمافيا: شاركوا في النقاش واتهموا الآخرين. الصمت يثير الشك.']]
]};
function guideView(){return head(t('guideT'))+(GUIDE[S.lang]||GUIDE.en).map(([h,ps])=>`<div class="sec guide"><div class="sh"><h3>${h}</h3></div>${ps.map(x=>`<p>${x}</p>`).join('')}</div>`).join('');}
function ask(title,desc,yes,fn){ask.fn=fn;$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)$('modal').innerHTML=''"><div class="sheet"><h3>${title}</h3><p>${desc}</p>

/* ---------- multiplayer, stage 1: connection test ---------- */
const PORT=8765;
const MP={role:null,players:{},seq:0,timer:null,status:'',lat:0,room:null,host:null,scanTok:0,pct:0,sig:''};
const hasNet=()=>!!(window.Net&&window.Net.put);
function myId(){let id=null;try{id=localStorage.getItem('mafiaDealer.id');}catch(e){}if(!id){id=Math.random().toString(36).slice(2,10);try{localStorage.setItem('mafiaDealer.id',id);}catch(e){}}return id;}
function parseIp(str){const [a,b]=String(str||'0,0').split(',').map(Number);const d=n=>n?[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255].join('.'):'';return{ip:d(a),gw:d(b)};}
function toast(msg){const e=$('toast');if(!e)return;e.textContent=msg;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2600);}
function buzzFx(){try{navigator.vibrate&&navigator.vibrate([90,60,90]);}catch(e){}SND.unlock();SND.hit(false);const f=$('flash');if(f){f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}}
function mpView(){
  return head(t('mpT'))+`
  <div class="sec"><div class="flbl" style="margin-top:0">${t('yourName')}</div>${me()?`<div class="meline">${avatarHtml(me().avatar,me().id,40)}<div><b>${esc(me().display)}</b><small>${t('fromProfile')}</small></div></div>`:`<input class="search" style="margin:0" maxlength="18" value="${esc(S.mpName||'')}" oninput="S.mpName=this.value;persist()"><p class="mpinfo" style="margin:8px 0 0">${t('aNameTip')}</p>`}</div>
  ${resumeMpBtn()}
  <button class="tile t1" id="mode-wifi" onclick="nav('wifi')"><i class="ti">${IC.wifi}</i><b>${t('modeWifi')}</b><small>${t('modeWifiSub')}</small><span class="go">›</span></button>
  <button class="tile t2" id="mode-online" onclick="nav('online')"><i class="ti">${IC.globe}</i><b>${t('modeOnline')}</b><small>${t('modeOnlineSub')}</small><span class="go">›</span></button>`;}
function wifiView(){return head(t('modeWifi'))+`<p class="mpinfo">${t('mpInfo')}</p><div class="big2"><button class="btn primary" onclick="hostStart()">${t('host')}<small>${t('hostSub')}</small></button><button class="btn ghost" onclick="joinStart()">${t('join')}<small>${t('joinSub')}</small></button></div>`;}
function onlineView(){return head(t('modeOnline'))+`<p class="mpinfo">${t('onlineSub')}</p>
   <div class="sec"><div class="flbl" style="margin-top:0">${t('roomCode')}</div><input id="ocode" class="search codein" inputmode="numeric" maxlength="7" placeholder="000000">
   <div class="big2"><button class="btn primary" onclick="hostStart(true)">${t('hostOnline')}</button><button class="btn ghost" onclick="joinOnline($('ocode').value)">${t('joinOnline')}</button></div>
   </div>`;}
function needName(online){if(online&&!me()){toast(t('needAcct'));nav('account');return true;}if(me())S.mpName=me().display;if(!(S.mpName||'').trim()){toast(t('needName'));return true;}if(!online&&!hasNet()){toast(t('mpNoNet'));return true;}return false;}
/* host */
function hostStart(online){if(needName(online))return;SND.unlock();S.mpName=S.mpName.trim();save();
  MP.role='host';MP.players={};MP.kicked={};MP.seq=0;MP.pubAt=0;MP.game=null;
  MP.online=online?{code:String(100000+Math.floor(Math.random()*900000)),key:rnd(24)}:null;HN=MP.online?onlineNet(MP.online):window.Net;
  hostOpen();hostPublish();nav('host');}
function hostOpen(){lsSet(JNK,null);HN.clear();HN.start(PORT);HN.put('room',S.mpName);MP.myIp=parseIp(HN.ip()).ip;keepOn(true);
  clearInterval(MP.timer);MP.timer=setInterval(hostTick,250);}
/* the host snapshots the room + game so a killed or restarted app can resume it */
const MPK='mafiaDealer.mp',JNK='mafiaDealer.join',FRESH=12*3600e3;
const keepOn=on=>{try{window.Net&&Net.keep&&Net.keep(on);}catch(e){}};
function lsGet(k){try{const s=JSON.parse(localStorage.getItem(k)||'null');return s&&Date.now()-s.at<FRESH?s:null;}catch(e){return null;}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,JSON.stringify(Object.assign({at:Date.now()},v)));else localStorage.removeItem(k);}catch(e){}}
function mpSnap(){lsSet(MPK,MP.role==='host'&&MP.game?{seq:MP.seq,game:MP.game,G:G&&G.mp?G:null,players:MP.players,online:MP.online}:null);}
/* online: one WebSocket to the relay (one Durable Object per room code); same put/take/clear as the native Net */
const RELAY='wss://mafia-relay.mafiadealer.workers.dev';
const relayUrl=()=>(S.relay||RELAY).replace(/\/+$/,'');
const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
let HN=null;
/* ---------- accounts (relay /acc/*): username + password; Telegram for a forgotten password ---------- */
const relayHttp=()=>relayUrl().replace(/^ws/,'http');
function aReq(path,body){const c=new AbortController();setTimeout(()=>c.abort(),15000);
  return fetch(relayHttp()+path,{method:body?'POST':'GET',headers:Object.assign(body?{'content-type':'application/json'}:{},S.acct?{authorization:'Bearer '+S.acct.tok}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store',signal:c.signal})
   .then(r=>r.json().catch(()=>({})).then(j=>{if(!r.ok){if(r.status===401&&j.err==='auth'&&S.acct){S.acct=null;save();}throw Object.assign(new Error(j.err||r.status),{code:j.err||String(r.status)});}return j;}));}
const AVP=[['#ff4d7d','mafia'],['#3ce0a0','doctor'],['#5aa2ff','detective'],['#ffc65a','citizen'],['#b98bff','moon'],['#ff8a3d','crown'],['#4dd4e0','eye'],['#e05a5a','skull'],['#9adf5a','trophy'],['#c9c3d6','users']];
function avatarHtml(av,uid,size){size=size||40;av=av||'p:0';
  if(av.indexOf('i:')===0&&uid)return `<span class="avt" style="width:${size}px;height:${size}px"><img src="${relayHttp()}/a/${uid}?v=${av.slice(2)}" alt="" onerror="this.parentNode.outerHTML=avatarHtml('p:0','',${size})"></span>`;
  const d=AVP[+av.slice(2)]||AVP[0];return `<span class="avt" style="width:${size}px;height:${size}px;background:${d[0]}26;color:${d[0]}">${IC[d[1]]}</span>`;}
const me=()=>S.acct&&S.acct.u;
function signedIn(r){S.acct={tok:r.tok,u:r.user};S.mpName=r.user.display;save();}
function acctRefresh(){if(S.acct)aReq('/acc/me').then(j=>{S.acct.u=j.user;S.mpName=j.user.display;save();if(V==='account'||V==='home')render();}).catch(()=>{});}
const AERR={uname:'aErrUname',pass:'aErrPass',taken:'aErrTaken',wrong:'aErrWrong',locked:'aErrLocked',nouser:'aErrNouser',notg:'aErrNotg',code:'aErrCode',avatar:'aErrAvatar'};
const aErr=e=>toast(t(AERR[e&&e.code]||'gOffline'));
let AF={mode:'in',av:null,busy:false};
function acctSubmit(){if(AF.busy)return;const un=$('aun').value.trim(),pw=$('apw').value;
  if(AF.mode==='up'&&pw!==$('apw2').value){toast(t('aErrMatch'));return;}
  AF.busy=true;aReq(AF.mode==='up'?'/acc/signup':'/acc/login',{uname:un,pass:pw}).then(r=>{signedIn(r);toast(t(AF.mode==='up'?'aWelcome':'aHello',{n:esc(r.user.display)}));render();}).catch(aErr).finally(()=>{AF.busy=false;});}
function setAv(v){AF.av=v;render();}
function pickPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const z=192,c=document.createElement('canvas');c.width=c.height=z;const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);AF.av=c.toDataURL('image/jpeg',0.82);render();};im.src=rd.result;};rd.readAsDataURL(f);}
function saveProfile(){const u=me();if(!u)return;const body={display:(AF.dn!=null?AF.dn:$('adn').value).trim()||u.uname,fav:AF.fav!=null?AF.fav:u.fav};if(AF.av)body.avatar=AF.av;
  aReq('/acc/profile',body).then(j=>{S.acct.u=j.user;S.mpName=j.user.display;AF.av=null;AF.fav=null;AF.dn=null;save();toast(t('aSaved'));render();}).catch(aErr);}
function pollUntil(fn,ms){const t0=Date.now();return new Promise(res=>{const tick=()=>fn().then(x=>{if(x)res(true);else if(Date.now()-t0>ms)res(false);else setTimeout(tick,2500);}).catch(()=>setTimeout(tick,2500));tick();});}
function openTg(bot,code){openUrl('https://t.me/'+bot+'?start='+code);}
function linkTg(){aReq('/acc/tglink',{}).then(j=>{if(!j.bot){toast(t('aNoBot'));return;}openTg(j.bot,j.code);toast(t('aTgGo'));
  pollUntil(()=>aReq('/acc/me').then(x=>{S.acct.u=x.user;save();return x.user.tg;}),180000).then(okk=>{if(okk){toast(t('aTgDone'));render();}});}).catch(aErr);}
function signOut(){ask(t('aOutQ'),t('aOutD'),t('aOut'),()=>{aReq('/acc/logout',{}).catch(()=>{});S.acct=null;save();render();});}
function delAcct(){$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)$('modal').innerHTML=''"><div class="sheet"><h3>${t('aDelQ')}</h3><p>${t('aDelD')}</p>
  <div class="flbl">${t('aDelPw')}</div><input id="dpw" class="search" type="password" style="direction:ltr">
  <button class="btn ghost" onclick="$('modal').innerHTML=''">${t('cancel')}</button><button class="btn primary mt" style="background:var(--red)" onclick="delAcctGo()">${t('aDel')}</button></div></div>`;}
function delAcctGo(){const pw=$('dpw').value;if(!pw)return;aReq('/acc/delete',{pass:pw}).then(()=>{$('modal').innerHTML='';S.acct=null;save();toast(t('aDeleted'));render();}).catch(aErr);}
let RS=null;  // password reset in progress
function resetStart(){const un=$('run').value.trim();if(!un)return;aReq('/acc/reset/start',{uname:un}).then(j=>{if(!j.bot){toast(t('aNoBot'));return;}RS={code:j.code,ok:false};render();openTg(j.bot,j.code);
  pollUntil(()=>aReq('/acc/reset/status?code='+RS.code).then(x=>x.ok),15*60e3).then(okk=>{if(okk&&RS){RS.ok=true;render();}});}).catch(aErr);}
function resetFinish(){const pw=$('rpw').value;if(pw!==$('rpw2').value){toast(t('aErrMatch'));return;}
  aReq('/acc/reset/finish',{code:RS.code,pass:pw}).then(r=>{RS=null;signedIn(r);toast(t('aResetDone'));V='account';render();}).catch(aErr);}
function accountView(){const u=me();
  if(!u){const up=AF.mode==='up';
    return head(t('acctT'))+`<p class="mpinfo">${t('aWhy')}</p><div class="seg wide2">${['in','up'].map(m=>`<button class="${AF.mode===m?'on':''}" onclick="AF.mode='${m}';render()">${t(m==='in'?'aIn':'aUp')}</button>`).join('')}</div>
     <div class="sec mt"><div class="flbl" style="margin-top:0">${t('aUser')}</div><input id="aun" class="search" maxlength="20" autocapitalize="none" autocomplete="username" style="direction:ltr" placeholder="${up?t('aUserHint'):''}">
      <div class="flbl">${t('aPass')}</div><input id="apw" class="search" type="password" maxlength="100" autocomplete="${up?'new-password':'current-password'}" style="direction:ltr">
      ${up?`<div class="flbl">${t('aPass2')}</div><input id="apw2" class="search" type="password" maxlength="100" style="direction:ltr">`:''}
      <button class="btn primary mt" onclick="acctSubmit()">${t(up?'aUp':'aIn')}</button>
      ${up?'':`<button class="link discard" onclick="RS=null;nav('forgot')">${t('aForgot')}</button>`}</div>`;}
  const av=AF.av||u.avatar,fav=AF.fav!=null?AF.fav:u.fav;
  return head(t('profT'))+`<div class="big pro"><div class="pav">${AF.av&&AF.av.indexOf('data:')===0?`<span class="avt" style="width:96px;height:96px"><img src="${AF.av}" alt=""></span>`:avatarHtml(av,u.id,96)}</div>
     <div class="who" style="font-size:26px">${esc(u.display)}</div><p class="hint" style="margin:0;direction:ltr">@${esc(u.uname)}</p></div>
   <div class="sec mt"><div class="flbl" style="margin-top:0">${t('aAvatar')}</div><div class="avgrid">${AVP.map((x,i)=>`<button class="${av==='p:'+i?'on':''}" onclick="setAv('p:${i}')">${avatarHtml('p:'+i,'',40)}</button>`).join('')}
     <label class="avup">${IC.share}<span>${t('aPhoto')}</span><input type="file" accept="image/*" onchange="pickPhoto(this)" style="display:none"></label></div>
    <div class="flbl">${t('aName')}</div><input id="adn" class="search" maxlength="18" value="${esc(AF.dn!=null?AF.dn:u.display)}" oninput="AF.dn=this.value">
    <div class="flbl">${t('aFav')}</div><div class="chips">${['','mafia','doctor','detective','citizen'].map(r=>`<button class="chipb ${fav===r?'on':''}" onclick="AF.fav='${r}';render()">${r?t(r):t('aNone')}</button>`).join('')}</div>
    <button class="btn primary mt" onclick="saveProfile()">${t('aSave')}</button></div>
   <div class="sec"><div class="sh"><h3>Telegram</h3>${u.tg?`<span class="badge ok">${t('aLinked')}</span>`:''}</div><p class="mpinfo" style="margin:0 0 10px">${t(u.tg?'aTgOk':'aTgWhy')}</p>
    ${u.tg?'':`<button class="btn ghost" onclick="linkTg()">${t('aTgLink')}</button>`}</div>
   <button class="btn ghost" onclick="signOut()">${t('aOut')}</button><button class="danger" onclick="delAcct()">${t('aDel')}</button>`;}
function forgotView(){
  if(RS&&RS.ok)return head(t('aForgot'))+`<div class="sec"><p class="mpinfo" style="margin-top:0">${t('aNewPw')}</p><div class="flbl">${t('aPass')}</div><input id="rpw" class="search" type="password" maxlength="100" style="direction:ltr">
     <div class="flbl">${t('aPass2')}</div><input id="rpw2" class="search" type="password" maxlength="100" style="direction:ltr"><button class="btn primary mt" onclick="resetFinish()">${t('aSetPw')}</button></div>`;
  if(RS)return head(t('aForgot'))+`<div class="big"><div class="spin"></div><p class="hint">${t('aWaitTg')}</p><button class="btn ghost" onclick="RS=null;render()">${t('cancel')}</button></div>`;
  return head(t('aForgot'))+`<p class="mpinfo">${t('aForgotD')}</p><div class="sec"><div class="flbl" style="margin-top:0">${t('aUser')}</div><input id="run" class="search" maxlength="20" autocapitalize="none" style="direction:ltr">
   <button class="btn primary mt" onclick="resetStart()">${t('aViaTg')}</button></div>`;}
/* ---------- shared group history: one Durable Object per 8-letter group code on the relay ---------- */
if(!S.devKey){S.devKey=rnd(24);save();}  // secret per phone: only the phone that uploaded a game may edit it
const GAL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const LOG=()=>S.group?(S.gcache||[]):S.log;
const gUrl=p=>relayUrl().replace(/^ws/,'http')+'/g/'+S.group.code+(p||'');
function gReq(path,body){const c=new AbortController();setTimeout(()=>c.abort(),12000);
  return fetch(gUrl(path),{method:body?'POST':'GET',headers:Object.assign({'x-dev':S.devKey},body?{'content-type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store',signal:c.signal})
   .then(r=>r.ok?r.json():Promise.reject(r.status));}
let gBusy=null;
function gSync(){if(!S.group)return Promise.resolve();if(gBusy)return gBusy;
  const pend=S.log.filter(g=>!(S.gsent||[]).includes(g.id));
  return gBusy=(pend.length?gReq('/add',{games:pend}).then(()=>{S.gsent=(S.gsent||[]).concat(pend.map(g=>g.id)).slice(-3000);save();}):Promise.resolve())
   .then(()=>gReq('')).then(j=>{if(!j.exists)return;S.gcache=j.games;S.gsync=Date.now();save();
     const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
     if(!G&&!typing&&(['home','history','stats','profile','settings'].includes(V)||V.indexOf('game:')===0))render();})
   .catch(()=>{}).finally(()=>{gBusy=null;});}
function gCreate(){let c='';for(const x of crypto.getRandomValues(new Uint8Array(8)))c+=GAL[x%32];
  S.group={code:c};S.gsent=[];S.gcache=S.log.map(g=>Object.assign({mine:true},g));save();render();gSync().then(()=>{toast(t('gCreated'));render();});}
function gJoin(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!/^[A-Z2-9]{8}$/.test(code)){toast(t('gBad'));return;}
  const old=S.group;S.group={code};
  gReq('').then(j=>{if(!j.exists){S.group=old;toast(t('gNotFound'));render();return;}S.gsent=[];S.gcache=j.games;save();render();gSync().then(()=>{toast(t('gJoined'));render();});})

async function probe(ip,ms){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch('http://'+ip+':'+PORT+'/s?room',{signal:c.signal,cache:'no-store'});const tx=await r.text();return tx||null;}catch(e){return null;}finally{clearTimeout(tm);}}
async function findHost(tok,want){const my=parseIp(Net.ip()),ok=n=>n&&(!want||n===want);
  if(S.mpLastHost){const n=await probe(S.mpLastHost,1500);if(ok(n))return{ip:S.mpLastHost,name:n};}
  if(tok!==MP.scanTok)return null;
  if(!my.ip&&!my.gw)return{err:'nowifi'};
  const c=[];if(my.gw)c.push(my.gw);
  if(my.ip){const pre=my.ip.split('.').slice(0,3).join('.');for(let i=1;i<255;i++){const x=pre+'.'+i;if(x!==my.ip&&x!==my.gw)c.push(x);}}
  for(let i=0;i<c.length;i+=64){if(tok!==MP.scanTok)return null;MP.pct=Math.round(i/c.length*100);const e=$('pct');if(e)e.textContent=t('searchPct',{n:MP.pct});
    const res=await Promise.all(c.slice(i,i+64).map(ip=>probe(ip,1800).then(n=>ok(n)?{ip,name:n}:null)));const f=res.find(Boolean);if(f)return f;}
  return{err:'notfound'};}
async function joinStart(manual){if(needName())return;SND.unlock();S.mpName=S.mpName.trim();save();

  if(V!=='join')nav('join');else render();
  let r;
  if(manual){const ip=manual.trim();const n=await probe(ip,2500);r=n?{ip,name:n}:{err:'notfound'};}else r=await findHost(tok);
  if(tok!==MP.scanTok||MP.role!=='client')return;
  if(!r||r.err){MP.status=r?r.err:'notfound';render();return;}
  MP.host=r;S.mpLastHost=r.ip;save();lsSet(JNK,{host:r});MP.status='joining';hello();
  MP.hb=0;MP.lastOk=Date.now();clearInterval(MP.timer);MP.timer=setInterval(clientTick,700);render();}
function joinOnline(code){code=String(code||'').replace(/\D/g,'');if(code.length!==6){toast(t('enterCode'));return;}if(needName(true))return;SND.unlock();S.mpName=S.mpName.trim();save();
  clientStop(false);MP.role='client';MP.id=myId();MP.room=null;MP.host={name:'',ip:''};MP.online={code};MP.status='joining';MP.last=null;MP.roomName=null;MP.hostOn=0;MP.everOk=false;
  if(V!=='join')nav('join');else render();

function clientWs(){const o=MP.online;if(!o||MP.role!=='client')return;MP.wsAt=Date.now();const ws=MP.ws=new WebSocket(relayUrl()+'/r/'+o.code+'?role=p&id='+MP.id+(S.acct?'&tok='+S.acct.tok:''));

    if(m.k==='room'){MP.roomName=m.v;MP.host.name=m.v;}else if(m.k)MP.last=m.v;
    if(m.host!=null)MP.hostOn=m.host;

  ws.onclose=()=>{if(MP.ws===ws&&MP.role==='client'&&MP.online)setTimeout(()=>{if(MP.ws===ws)clientWs();},1500);};}
async function cGet(){
  if(MP.online){const w=MP.ws;if(w&&w.readyState===1&&MP.hb%3===0)w.send('ping');
    if(w&&Date.now()-MP.wsAt>7000){MP.ws=null;try{w.close();}catch(e){}clientWs();throw 0;}  // silent dead link (Wi-Fi gone): reconnect
    if(!w||w.readyState!==1||Date.now()-MP.wsAt>4500||(!MP.hostOn&&MP.roomName!==''))throw 0;return MP.last||'';}
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500);
  try{const r=await fetch('http://'+MP.host.ip+':'+PORT+'/s?p_'+MP.id,{signal:c.signal,cache:'no-store'});return await r.text();}finally{clearTimeout(tm);}}
function send(o){if(MP.online){o.id=MP.id;try{if(MP.ws&&MP.ws.readyState===1)MP.ws.send(encodeURIComponent(JSON.stringify(o)));}catch(e){}return;}

async function clientTick(){if(MP.busy||MP.role!=='client')return;MP.busy=true;const t0=Date.now();
  try{const tx=await cGet();
    MP.lat=Date.now()-t0;MP.lastOk=Date.now();
    if(!tx){const n=MP.online?MP.roomName:await probe(MP.host.ip,1500);
      if(!n&&!(MP.online&&MP.roomName==null)){MP.status=MP.online&&!MP.everOk?'noroom':'closed';lsSet(JNK,null);}else{MP.status='joining';if(Date.now()-MP.helloAt>2000)hello();}}
    else{const st=JSON.parse(tx);
      if(st.err){MP.status=st.err==='name'?'taken':st.err==='started'?'started':st.err==='kicked'?'kicked':'full';clientStop(false);lsSet(JNK,null);}
      else{const ping=MP.room&&st.seq>MP.room.seq;MP.room=st;MP.status='ok';MP.everOk=true;if(ping){buzzFx();toast(t('pingedYou'));}
        if(st.g&&!st.g.ph&&MP.readyDeal===st.g.deal&&!st.g.meReady&&MP.hb%2===0)send({t:'ready',deal:st.g.deal});
        const g=st.g;if(g&&MP.sent&&MP.hb%2===0){if(g.ph==='night'&&MP.sent.k==='n'+g.n)send({t:'act',n:g.n,sel:MP.sent.sel});if(g.ph==='vote'&&MP.sent.k==='v'+g.v)send({t:'vote',v:g.v,sel:MP.sent.sel});}}}}
  catch(e){const gone=Date.now()-MP.lastOk;if(gone>4000)MP.status='lost';if(gone>8000&&!MP.online)rescan();}
  MP.busy=false;if(MP.role==='client'&&++MP.hb%3===0)send({t:'hb'});
  if(V==='join'){const sig=joinSig();if(sig!==MP.sig)render();else{const e=$('lat');if(e&&!MP.online)e.textContent=t('lat',{n:MP.lat});}}}
function clientStop(bye){clearInterval(MP.timer);MP.timer=null;MP.scanTok++;if(bye&&MP.role==='client'&&MP.host)send({t:'bye'});if(MP.ws){const w=MP.ws;MP.ws=null;setTimeout(()=>{try{w.close();}catch(e){}},300);}if(bye){MP.role=null;MP.online=null;lsSet(JNK,null);}}

function joinTitle(){const g=MP.room&&MP.room.g,h=MP.host&&MP.host.name;
  if(g&&g.ph){if(g.ph==='night'||g.ph==='nightDone')return t('night')+' '+g.n;if(g.ph==='vote'||g.ph==='voted')return t('ballot');if(g.ph==='end')return t('gameOver');
    if(g.ph==='dead')return t('outT');return t(LBL[g.label]||'roomOf',{n:esc(h||'')})+(g.label==='morning'||g.label==='day'?' '+g.day:'');}
  return h?t('roomOf',{n:esc(h)}):t('join');}
function leaveAsk(){askLeaveRoom();}

/* ---------- shell ---------- */
const stage=inner=>`<div class="stage">${inner}</div>`;
function render(){
  let h;
  if(!G)h=V==='setup'?setupView():V==='history'?historyView():V==='stats'?statsView():V==='guide'?guideView():V==='account'?accountView():V==='forgot'?forgotView():V==='profile'?profileView():V==='rules'?rulesView():V==='settings'?settingsView():V==='mp'?mpView():V==='wifi'?wifiView():V==='online'?onlineView():V==='host'?hostView():V==='join'?joinView():V.indexOf('game:')===0?gameView(+V.slice(5)):homeView();
  else{
    const v={mpNight:mpNightView,mpVote:mpVoteView,deal:dealView,nightPass:nightPassView,nightAct:nightActView,nightDone:nightDoneView,dawn:dawnView,morning:morningView,day:dayView,ballotPass:ballotPassView,ballotAct:ballotActView,verdict:verdictView,end:endView}[G.phase];
    h=v();
    if(G.phase!=='end'&&!(['morning','verdict'].includes(G.phase)&&!G.revealed))h+=`<div class="footer">${t('round')} ${G.day} · ${aliveIdx().length}/${G.names.length} ${t('alive')}</div>`;
  }
  document.documentElement.dataset.theme=S.theme==='noir'?'noir':'neon';RC=RCS[S.theme==='noir'?'noir':'neon'];document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const ph=G?G.phase:'';let th='';
  if(['nightPass','nightAct','nightDone','dawn','mpNight'].includes(ph))th='night';else if(['day','ballotPass','ballotAct','mpVote'].includes(ph)||(ph==='morning'&&G.revealed&&G.morning==null)||(ph==='verdict'&&G.revealed&&G.verdict.j==null))th='day';
  else if((ph==='morning'||ph==='verdict')&&G.revealed)th='blood';else if(ph==='morning'||ph==='verdict')th=ph==='morning'?'day':'';
  else if(ph==='end'&&G.revealed)th=G.winner==='mafia'?'blood':'glory';
  document.body.className=th;
  if(G&&G.mp&&MP.role==='host'&&S.host.kick==='any'&&G.phase!=='end')h+=`<button class="pfab" onclick="playersSheet()" aria-label="${t('playersT')}">${IC.users}</button>`;
  const key=G?ph+'|'+G.i+'|'+G.day+'|'+G.revealed+'|'+G.mode+'|'+G.logId:'v:'+V;const app=$('app');
  app.classList.toggle('anim',key!==render.last);render.last=key;
  app.innerHTML=h;
  if(G&&['morning','verdict','end'].includes(ph)&&!G.revealed&&!revealTimer)arm(1.5);
  if($('hold'))bindHold();
}
function showQuit(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)keepPlaying()"><div class="sheet"><h3>${t('quitQ')}</h3><p>${t(G&&G.mp?'quitMp':'quitD')}</p>
  <button class="btn ghost" onclick="keepPlaying()">${t('keep')}</button><button class="btn primary mt" onclick="quitGame()">${t('quit')}</button></div></div>`;
}
function keepPlaying(){$('modal').innerHTML='';enterGame();}
function quitGame(){hush();$('modal').innerHTML='';if(G&&G.mp){stopTimer();G=null;hostBackRoom();V='host';render();return;}stopTimer();save();G=null;resumeOffer=!!S.game;V='home';render();}
{const J=lsGet(JNK);if(J&&(S.mpName||'').trim()&&(J.online||hasNet()))setTimeout(()=>{V='mp';J.online?joinOnline(J.online.code):joinStart();},0);}
for(const m of Object.keys(NARR)){const f=NARR[m];NARR[m]=(...a)=>{f(...a);if(MP.role==='host'&&MP.online&&HN&&HN.bc)HN.bc({narr:m,a});};}
const INTRO=[['users','introT1','introD1'],['eye','introT2','introD2'],['moon','introT3','introD3']];
function showIntro(i){i=i||0;const [ic,tt,dd]=INTRO[i];
  const body=`<div class="idots">${INTRO.map((x,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><div class="icard"><div class="iorb">${IC[ic]}</div><h2 class="h">${t(tt)}</h2><p>${t(dd)}</p></div>
   <div class="row2"><button class="btn ghost" onclick="introDone()">${t('iSkip')}</button><button class="btn primary" onclick="${i<INTRO.length-1?`showIntro(${i+1})`:'introDone()'}">${t(i<INTRO.length-1?'iNext':'iGo')}</button></div>`;
  const el=document.querySelector('#modal .intro');if(el)el.innerHTML=body;else $('modal').innerHTML=`<div class="intro">${body}</div>`;}
function introDone(){S.intro=1;save();$('modal').innerHTML='';}
if(!S.intro&&!navigator.webdriver)setTimeout(showIntro,400);  // automated test browsers skip it
setTimeout(()=>checkUpdate(true),1500);setTimeout(acctRefresh,1800);  // every app start: version.json is a free static filesetTimeout(gSync,2000);
window.addEventListener('popstate',()=>{if(G){if(G.phase==='end'){finish();return;}showQuit();}else if(inRoom()){try{history.pushState({v:1},'');}catch(e){}askLeaveRoom();}else if(V!=='home')popNav();});
render();
</script>
