<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mafia Dealer</title>
<style>
:root{
  --bg:#0b0a0f; --bg2:#14121b; --card:#1a1722; --card2:#221e2c; --line:#2e2939;
  --text:#f2eee6; --mute:#9a93a8; --dim:#6b6478;
  --red:#d7263d; --red2:#ff4d63; --gold:#e8b65a; --green:#3ccf91; --blue:#5aa9ff;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",sans-serif;font-size:16px;min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a0f17 0%,var(--bg) 60%) fixed;padding:14px 14px 90px;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;margin:4px 2px 16px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--red),#6d0f1d);display:grid;place-items:center;box-shadow:0 6px 20px #d7263d40;flex:none}
.logo svg{width:24px;height:24px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:19px;letter-spacing:.3px}
.brand span{font-size:12.5px;color:var(--mute)}
.pill{height:38px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sh h3{font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);font-weight:700}
.link{color:var(--gold);font-weight:700;font-size:14px;padding:6px 2px}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.num{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute);flex:none}
.prow input{flex:1;min-width:0;height:46px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:0 14px;outline:none}
.prow input:focus{border-color:var(--gold)}
.x{width:42px;height:42px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--mute);font-size:20px;flex:none}
.role{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:8px}
.ric{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ric svg{width:22px;height:22px}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:16px}
.rt span{font-size:12.5px;color:var(--mute);line-height:1.35;display:block}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px;font-weight:700}
.step i{font-style:normal;width:22px;text-align:center;font-weight:800;font-size:17px}
.auto{font-size:12px;color:var(--dim);font-weight:600;padding:0 4px}
.badge{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px}
.ok{background:#3ccf9122;color:var(--green)}
.bad{background:#d7263d22;color:var(--red2)}
.tg{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg .rt b{font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#7c7589;transition:.2s}
.sw.on{background:var(--red);border-color:var(--red)}
.sw.on:after{inset-inline-start:23px;background:#fff}
.cta{position:fixed;left:14px;right:14px;bottom:14px;z-index:5}
.btn{width:100%;min-height:56px;border-radius:16px;font-weight:800;font-size:17px;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary{background:linear-gradient(135deg,var(--red),#9b1428);box-shadow:0 10px 30px #d7263d45}
.primary:disabled{background:var(--card2);color:var(--dim);box-shadow:none}
.ghost{background:var(--card2);border:1px solid var(--line)}
.gold{background:linear-gradient(135deg,var(--gold),#b07a22);color:#1b1206}
.mt{margin-top:10px}
.stage{min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:center}
.big{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 20px;text-align:center}
.chip{display:inline-block;font-size:13px;font-weight:700;color:var(--gold);background:#e8b65a18;border:1px solid #e8b65a40;padding:6px 14px;border-radius:99px;margin-bottom:18px}
.lbl{font-size:12.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);font-weight:700}
.who{font-size:34px;font-weight:900;margin:6px 0 10px;word-break:break-word}
.hint{color:var(--mute);font-size:14.5px;line-height:1.5;margin-bottom:22px}
.orb{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.orb svg{width:44px;height:44px}
.hold{position:relative;height:210px;border-radius:20px;border:1.5px dashed var(--line);display:grid;place-items:center;margin-bottom:16px;background:var(--bg2);overflow:hidden}
.hold .cover{color:var(--mute);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:10px}
.hold .cover svg{width:38px;height:38px;opacity:.7}
.hold.show{border-style:solid;border-color:var(--gold)}
.rv{display:none;flex-direction:column;align-items:center;gap:8px}
.hold.show .rv{display:flex}.hold.show .cover{display:none}
.rv .rn{font-size:36px;font-weight:900}
.rv .rd{font-size:14px;color:var(--mute);padding:0 10px}
.rv .mates{font-size:13px;color:var(--red2);font-weight:700;margin-top:4px}
.act{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ah span{color:var(--mute);font-weight:700;font-size:14px}
.act h2{font-size:22px;margin:6px 0 4px}
.act p.d{color:var(--mute);font-size:14px;line-height:1.45;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line);text-align:start;width:100%}
.opt b{flex:1;font-size:16px}
.opt small{color:var(--mute);font-size:12.5px;font-weight:600}
.opt .tag{color:var(--red2)}
.opt .rad{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.opt.sel{border-color:var(--gold);background:#e8b65a12}
.opt.sel .rad{border-color:var(--gold);background:var(--gold)}
.opt.sel .rad:after{content:"";width:8px;height:8px;border-radius:50%;background:#1b1206}
.opt:disabled{opacity:.38}
.opt.skip{border-style:dashed}
.res{font-size:26px;font-weight:900;margin:8px 0 6px;line-height:1.3}
.footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:10px;font-size:12.5px;color:var(--dim);pointer-events:none}
.timer{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.timer .t{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;flex:1;direction:ltr;text-align:start}
.timer .t.low{color:var(--red2)}
.tb{height:40px;padding:0 12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.tb.go{background:var(--green);border-color:var(--green);color:#04170e}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute)}
.tabs button.on{background:var(--card2);color:var(--text)}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.roster span{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.roster span.dead{text-decoration:line-through;color:var(--dim)}
.endrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.endrow:last-child{border:0}
.endrow s{color:var(--dim)}
.log{font-size:13.5px;color:var(--mute);line-height:1.7}
.modal{position:fixed;inset:0;background:#000000b0;display:flex;align-items:flex-end;z-index:20;padding:14px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;width:100%}
.sheet h3{font-size:18px;margin-bottom:6px}
.sheet p{color:var(--mute);font-size:14px;margin-bottom:14px;line-height:1.45}
.banner{background:#e8b65a14;border:1px solid #e8b65a40;border-radius:16px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.banner div{flex:1;font-size:14px}
.banner button{height:38px;padding:0 14px;border-radius:11px;font-weight:800;font-size:14px}
.tally{font-size:14px;color:var(--mute);margin-top:6px}
.skipleft{font-size:12px;color:var(--gold)}

body{transition:background 1.2s}
body.night{background:radial-gradient(120% 60% at 50% -10%,#16214d 0%,#070912 62%) fixed}
body.day{background:radial-gradient(120% 60% at 50% -10%,#5a3410 0%,#120c08 62%) fixed}
body.blood{background:radial-gradient(120% 70% at 50% -10%,#5c0b18 0%,#0b0508 65%) fixed}
body.glory{background:radial-gradient(120% 70% at 50% -10%,#5c4410 0%,#0d0a05 65%) fixed}
.sky{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:0;
 background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 42%,#cfd8ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 44% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 61% 30%,#cfd8ff 50%,transparent 51%),radial-gradient(2px 2px at 78% 16%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 38%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 8% 60%,#cfd8ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 35% 72%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 66%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 80%,#cfd8ff 50%,transparent 51%),radial-gradient(1px 1px at 52% 88%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 20% 90%,#fff 50%,transparent 51%);
 animation:twinkle 4s ease-in-out infinite alternate}
body.night .sky{opacity:1}
#app{position:relative;z-index:1}
@keyframes twinkle{from{filter:brightness(.6)}to{filter:brightness(1.3)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #e8b65a55}50%{transform:scale(1.07);box-shadow:0 0 0 18px #e8b65a00}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
#app.anim .stage>*,#app.anim>.sec,#app.anim>.big{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#app.anim>.sec:nth-child(2){animation-delay:.08s}#app.anim>.sec:nth-child(3){animation-delay:.16s}
#app.anim .pop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.dots{letter-spacing:6px;font-size:26px;animation:blink 1.4s infinite;margin-bottom:10px}
.big .who{text-shadow:0 2px 24px #0008}
.victim{font-size:40px;font-weight:900;margin:4px 0 6px;word-break:break-word}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{text-align:center;padding:34px 0 26px}
.hero .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 16px}.hero .logo svg{width:48px;height:48px}
.hero h1{font-size:30px;letter-spacing:.5px}.hero p{color:var(--mute);font-size:14px;margin-top:4px}
.btn small{font-weight:600;opacity:.6}
.crown{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:18px;color:var(--gold);font-weight:700;font-size:14.5px}
.crown svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipb{height:34px;padding:0 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}
.chipb.on{background:#e8b65a1c;border-color:var(--gold);color:var(--gold)}
.flbl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700;margin:6px 2px 5px}
.search{width:100%;height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 14px;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--gold)}
.gcard{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.gcard.inv{opacity:.5}
.gcard .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.gcard .r1 b{font-size:15.5px}.gcard .r1 span{font-size:12px;color:var(--mute)}
.gcard .r2{font-size:12.5px;color:var(--mute);line-height:1.5}
.tagi{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#ffffff14;color:var(--mute);margin-inline-start:6px}
.empty{text-align:center;color:var(--mute);padding:40px 20px;font-size:14.5px;line-height:1.6}
.titles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ttl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.ttl.wide{grid-column:1/3;border-color:#e8b65a55;background:linear-gradient(135deg,#e8b65a18,var(--card))}
.ttl i{font-style:normal;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);font-weight:700;display:block}
.ttl b{display:block;font-size:18px;margin:3px 0 1px;word-break:break-word}.ttl.wide b{font-size:24px;color:var(--gold)}
.ttl span{font-size:12.5px;color:var(--mute)}
.lb{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.lb:last-child{border:0}
.lb .rk{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mute);flex:none}
.lb .rk.g1{background:var(--gold);color:#1b1206}
.lb .nm{flex:1;min-width:0}.lb .nm b{display:block;font-size:15.5px;word-break:break-word}.lb .nm span{font-size:12px;color:var(--mute)}
.lb .pc{font-weight:900;font-size:17px;text-align:end}.lb .pc span{display:block;font-size:11.5px;color:var(--mute);font-weight:600}
.lb.nq{opacity:.55}
.danger{color:var(--red2);font-weight:700;font-size:14px;padding:12px;display:block;margin:6px auto}
.guide p{color:#cfc9d9;font-size:14.5px;line-height:1.65;margin-bottom:8px}.guide p:last-child{margin:0}.guide p b{color:var(--text)}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;font-size:15.5px}

.mpinfo{color:var(--mute);font-size:13.5px;line-height:1.55;margin-bottom:12px}
.big2{display:flex;gap:10px}.big2 .btn{flex:1;flex-direction:column;min-height:96px;gap:6px;font-size:17px}.big2 .btn small{font-size:12px;font-weight:600;opacity:.75}
.prs{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}.prs:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}.dot.on{background:var(--green);box-shadow:0 0 8px #3ccf9188}
.prs b{flex:1;min-width:0;word-break:break-word}.prs small{color:var(--mute);font-size:12px;font-weight:700}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);opacity:0;background:var(--card2);border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14.5px;z-index:30;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;background:var(--gold);opacity:0;pointer-events:none;z-index:25}
#flash.go{animation:fl .9s ease-out}@keyframes fl{0%{opacity:.55}100%{opacity:0}}
.ipline{font-size:13px;color:var(--mute);margin-top:6px;direction:ltr}
</style>
</head>
<body>
<div class="sky"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div><div id="flash"></div>
<script src="audio.js"></script>

const SND=(()=>{
 let C=null,M=null,R=null,NB=null;

 /* building blocks */
 function bell(t,f,vol){[[1,1,4],[2,.6,3],[2.4,.5,2.5],[3,.35,2],[4.2,.25,1.5],[5.4,.15,1]].forEach(([r,a,d])=>tone('sine',f*r,t,.005,vol*a,d,.9));}

  [110,130.8,155.6,207.6].forEach(f=>tone('sawtooth',f,t,.02,.06,2.6,.7,900));burst(t,'lowpass',400,.7,.5,1.2,.6);}

 const on=()=>S.rules.sfx&&ac();
 return{

/* ---------- narrator (pre-recorded clips in audio.js) ---------- */
const VOX=(()=>{let tok=0,live=[];const cache={};
 function buf(k){const C=SND.ctx();if(!C||!k||!CLIPS[k])return Promise.resolve(null);if(cache[k])return Promise.resolve(cache[k]);
  const bin=atob(CLIPS[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Promise(r=>{try{C.decodeAudioData(u.buffer,x=>{cache[k]=x;r(x);},()=>r(null));}catch(e){r(null);}});}
 function stop(){tok++;live.forEach(x=>{try{x.stop();}catch(e){}});live=[];}
 function play(keys,delay,cb){stop();if(!S.rules.voice)return;const C=SND.ctx();if(!C)return;const my=tok,t0=C.currentTime+(delay||0);
  Promise.all(keys.map(buf)).then(bs=>{if(my!==tok)return;let t=Math.max(t0,C.currentTime+.05);
   const marks=[];
   bs.forEach(x=>{marks.push(t-C.currentTime);if(!x)return;const s=C.createBufferSource(),g=C.createGain();g.gain.value=1.7;s.buffer=x;s.connect(g);g.connect(SND.out());s.start(t);live.push(s);t+=x.duration;});marks.push(t-C.currentTime);if(cb)cb(marks);});}
 function norm(n){return String(n).toLowerCase().trim().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[-'’.]/g,'').replace(/\s+/g,' ');}
 function name(n){const k=norm(n);return NAME_ALIAS[k]||NAME_ALIAS[k.split(' ')[0]]||null;}
 return{play,stop,name};})();
function hush(){VOX.stop();}
let revealTimer=null;

function revealNow(){clearTimeout(revealTimer);revealTimer=null;if(!G||G.revealed||!['morning','verdict','end'].includes(G.phase))return;
  G.revealed=true;if(G.mp)hostPublish();const bad=(G.phase==='morning'&&G.morning!=null)||(G.phase==='verdict'&&G.verdict.j!=null)||(G.phase==='end'&&G.winner==='mafia');

  if(G.phase==='morning')SND.hit(G.morning!=null);else if(G.phase==='verdict'&&G.verdict.j!=null)SND.hit(true);save();render();}
const NARR={

    if(dead!=null)VOX.play([pick1(['v_killed_1','v_killed_2','v_killed_3']),VOX.name(dead),role&&'v_was_'+role],2.8,m=>arm(m[1]-.15));
    else if(saved!=null)VOX.play([pick1(['v_saved_1','v_saved_2']),VOX.name(saved)],3.4,m=>arm(m[1]-.15));

  mafiaWin(names,lead){lead=lead||[];if(lead.length)SND.verdict(true);else SND.mafiaWin();arm(2);
    VOX.play([...lead,'v_laugh','v_mafia_win',...names.map(VOX.name)],1.5,m=>{if(lead.length)setTimeout(()=>SND.mafiaWin(),Math.max(m[lead.length]-.4,0)*1000);arm(m[lead.length]+.3);});},

/* ---------- game flow ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const r=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[r]]=[a[r],a[i]];}return a;}
function startGame(){
  if(new Set(S.players.map(nkey)).size<S.players.length){render();return;}
  const names=S.players.map((p,i)=>p.trim()||t('pname')+' '+(i+1));
  const deck=[];for(const r of ['mafia','doctor','detective'])for(let k=0;k<S.counts[r];k++)deck.push(r);
  while(deck.length<names.length)deck.push('citizen');
  names.filter(n=>!isDefaultName(n)).reverse().forEach(n=>{S.roster=S.roster.filter(x=>nkey(x)!==nkey(n));S.roster.unshift(n);});S.roster.length=Math.min(S.roster.length,30);
  G={ev:{first:null,saves:[],caught:[]},names,roles:shuffle(deck),alive:names.map(()=>true),day:1,phase:'deal',i:0,sel:null,
     skipUsed:false,act:{},lastProt:{},hist:[],morning:null,ballots:{},verdict:null,winner:null,mode:'consensus',revealed:false};
  resumeOffer=false;SND.unlock();NARR.welcome();enterGame();save();render();
}
function enterGame(){try{history.pushState({g:1},'');}catch(e){}}
function resumeGame(){SND.unlock();G=S.game;G.ev=G.ev||{first:null,saves:[],caught:[]};resumeOffer=false;enterGame();render();}

   ${rows?`<div class="list">${rows}</div>`:''}
   <button class="btn primary" ${key!=='none'&&G.sel===null?'disabled':''} onclick="lockNight()">${IC.lock.replace('<svg','<svg style="width:20px;height:20px"')}${t('confirm')}</button></div>`);
}
const optBtn=(j,name,tag,dis,red)=>`<button class="opt ${G.sel===j?'sel':''}" ${dis?'disabled':''} onclick="pick(${j})"><span class="num">${j+1}</span><b>${name}</b>${tag?`<small class="${red?'tag':''}">${esc(tag)}</small>`:''}<span class="rad"></span></button>`;
function pick(j){G.sel=j;render();}
function lockNight(){

}
function nightDoneView(){

    body=`<div class="orb" style="color:${is?'var(--red2)':'var(--green)'}">${IC.detective}</div><div class="res" style="color:${is?'var(--red2)':'var(--green)'}">${t(is?'isMafia':'notMafia',{n:nm(q)})}</div><p class="hint">${t('lockedHint')}</p>`;
  }

}
function nightNext(){if(G.i<G.order.length-1)go('nightPass',{i:G.i+1});else go('dawn');}
function dawnView(){return stage(`<div class="big"><div class="orb">${IC.sun}</div><div class="res">${t('allDone')}</div><p class="hint">${t('allDoneHint')}</p><button class="btn gold" onclick="resolveNight()">${t('dawn')}</button></div>`);}
function resolveNight(){
  // Mafia decision: most votes among living mafia; ties broken randomly
  const votes=Object.values(G.act.mafia);let target=null,skip=false;
  if(votes.length){
    const c={};votes.forEach(v=>{c[v]=(c[v]||0)+1;});
    const max=Math.max(...Object.values(c));const top=Object.keys(c).filter(k=>c[k]===max);
    const w=top[crypto.getRandomValues(new Uint32Array(1))[0]%top.length];
    if(w==='skip'){skip=true;G.skipUsed=true;}else target=+w;
  }
  const prot=new Set(Object.values(G.act.doctor).map(Number));
  G.lastProt=Object.assign({},G.act.doctor);
  let dead=null,h=t('h_night',{d:G.day});const parts=[];
  if(skip)parts.push(t('h_skip'));
  else if(target!=null){if(prot.has(target))parts.push(t('h_saved',{n:G.names[target]}));else{dead=target;G.alive[target]=false;parts.push(t('h_kill',{n:G.names[target]}));}}
  Object.values(G.act.detective).forEach(q=>parts.push(t('h_check',{n:G.names[q]})));
  G.hist.push(h+parts.join(' · '));
  G.ev=G.ev||{first:null,saves:[],caught:[]};
  G.lastTarget=target;G.savedP=(target!=null&&prot.has(target)&&S.rules.saverev)?target:null;
  if(target!=null&&prot.has(target))Object.entries(G.act.doctor).forEach(([p,q])=>{if(+q===target)G.ev.saves.push(+p);});
  if(dead!=null&&G.ev.first==null)G.ev.first=dead;
  Object.entries(G.act.detective).forEach(([p,q])=>{if(G.roles[q]==='mafia'&&!G.ev.caught.includes(p+':'+q))G.ev.caught.push(p+':'+q);});
  G.morning=dead;
  if(checkWin(dead!=null?['v_killed_1',VOX.name(G.names[dead])]:[]))return;
  NARR.morning(dead!=null?G.names[dead]:null,dead!=null&&S.rules.reveal?G.roles[dead]:null,G.savedP!=null?G.names[G.savedP]:null);
  go('morning');
}
function suspense(icon,chip,txt){return stage(`<div class="big">${chip?`<div class="chip">${chip}</div>`:''}<div class="orb pulse">${icon}</div><div class="res">${txt}</div><div class="dots">•••</div><button class="link" onclick="revealNow()">${t('skipWait')}</button></div>`);}

   :`<div class="orb pop">${IC.skull}</div><div class="lbl">${t('victimIs')}</div><div class="victim pop" style="color:var(--red2)">${nm(d)}</div>${S.rules.reveal?`<p class="hint">${t('wasRole',{r:t(G.roles[d])})}</p>`:''}`;
  return stage(`<div class="big"><div class="chip">${t('morning')} ${G.day}</div>${body}<div style="height:16px"></div>${roster()}<div style="height:18px"></div>
   <button class="btn primary" onclick="startDay()">${t('startDay',{d:G.day})}</button></div>`);
}
const roster=()=>`<div class="roster" style="justify-content:center">${G.names.map((n,i)=>`<span class="${G.alive[i]?'':'dead'}">${esc(n)}</span>`).join('')}</div>`;

/* day */
function startDay(){NARR.day();stopTimer();timer.left=S.rules.timer;go('day',{ballots:{}});}
function dayView(){
  const alive=aliveIdx();
  let h=`<div class="sec"><div class="sh"><h3>${t('discussion')} · ${t('round')} ${G.day}</h3></div>
  <div class="timer"><div class="t ${timer.left<=10?'low':''}" id="tt">${fmt(timer.left)}</div>
  <button class="tb ${timer.run?'':'go'}" onclick="toggleTimer()">${timer.run?t('pause'):t('start')}</button><button class="tb" onclick="timer.left+=60;upd()">+1m</button><button class="tb" onclick="stopTimer();timer.left=S.rules.timer;render()">${t('reset')}</button></div></div>
  <div class="sec"><div class="tabs"><button class="${G.mode==='consensus'?'on':''}" onclick="G.mode='consensus';G.sel=null;render()">${t('consensus')}</button><button class="${G.mode==='ballot'?'on':''}" onclick="G.mode='ballot';render()">${t('ballot')}</button></div>`;

    alive.forEach(j=>h+=optBtn(j,nm(j),'',false,false));
    h+=`</div><button class="btn primary" ${G.sel===null?'disabled':''} onclick="dayDecide()">${t('confirmDay')}</button>`;
  }else{
    h+=`<p style="color:var(--mute);font-size:14px;margin-bottom:12px">${t(G.mp?'mpBallotHint':'ballotHint')}</p><button class="btn primary" onclick="stopTimer();${G.mp?'mpStartVote()':`go('ballotPass',{i:0,order:aliveIdx(),ballots:{}})`}">${t('startBallot')}</button>`;
  }

}
function toggleTimer(){if(timer.run)stopTimer();else{timer.run=true;timer.h=setInterval(()=>{timer.left--;if(timer.left<=0){timer.left=0;stopTimer();alarm();NARR.timeUp();render();return;}upd();},1000);}render();}
function stopTimer(){timer.run=false;if(timer.h)clearInterval(timer.h);timer.h=null;}
function upd(){const e=$('tt');if(e){e.textContent=fmt(timer.left);e.classList.toggle('low',timer.left<=10);}}
function alarm(){try{navigator.vibrate&&navigator.vibrate([400,150,400]);}catch(e){}return;
  try{const A=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(s=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=880;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.25,A.currentTime+s);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+s+.3);o.start(A.currentTime+s);o.stop(A.currentTime+s+.3);});}catch(e){}}
function dayDecide(){stopTimer();applyVerdict(G.sel==='none'?null:G.sel,G.sel==='none'?'skipped':'out',null);}
function ballotPassView(){
  const p=G.order[G.i];
  return stage(`<div class="big"><div class="chip">${t('voteOf')} ${G.i+1}/${G.order.length}</div><div class="orb">${IC.phone}</div><div class="lbl">${t('passTo')}</div><div class="who">${nm(p)}</div>
   <p class="hint">${t('tiltHint')}</p><button class="btn primary" onclick="go('ballotAct')">${t('iam',{n:nm(p)})}</button></div>`);
}
function ballotActView(){
  const p=G.order[G.i];let rows=`<button class="opt skip ${G.sel==='none'?'sel':''}" onclick="pick('none')"><b>${t('noOne')}</b><span class="rad"></span></button>`;

  return stage(`<div class="act"><div class="ah"><span>${nm(p)}</span><span>${t('ballot')}</span></div><h2>${t('votePick')}</h2><div style="height:8px"></div>
   <div class="list">${rows}</div><button class="btn primary" ${G.sel===null?'disabled':''} onclick="castVote()">${t('castVote')}</button></div>`);
}
function tallyVotes(ballots){
  const c={};Object.values(ballots).filter(v=>v!=='abstain'&&v!=null).forEach(v=>{c[v]=(c[v]||0)+1;});
  if(!Object.keys(c).length){applyVerdict(null,'skipped','');return;}
  const max=Math.max(...Object.values(c));const top=Object.keys(c).filter(k=>c[k]===max);
  const tally=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>(k==='none'?t('noOne'):G.names[k])+': '+v).join(' · ');
  if(top.length>1)applyVerdict(null,'tie',tally);else if(top[0]==='none')applyVerdict(null,'skipped',tally);else applyVerdict(+top[0],'out',tally);}
function castVote(){
  G.ballots[G.order[G.i]]=G.sel;
  if(G.i<G.order.length-1){G.phase='ballotPass';G.i++;G.sel=null;save();
    $('app').innerHTML=stage(`<div class="big"><div class="orb">${IC.lock}</div><div class="res">${t('voted')}</div><p class="hint">${t('lockedHint')}</p><button class="btn ghost" onclick="render()">${t('done')}</button></div>`);return;}
  tallyVotes(G.ballots);
}
function applyVerdict(j,kind,tally){
  if(j!=null)G.alive[j]=false;
  G.hist.push(t('h_day',{d:G.day})+(j!=null?t('h_out',{n:G.names[j]}):t('h_none')));
  G.verdict={j,kind,tally};
  if(checkWin(j!=null?['v_vote_out',VOX.name(G.names[j])]:[]))return;
  NARR.verdict(j!=null?G.names[j]:null,j!=null&&S.rules.reveal?G.roles[j]:null,kind);
  go('verdict');
}

  if(v.j!=null)body=`<div class="orb pop">${IC.scale}</div><div class="lbl">${t('outIs')}</div><div class="victim pop" style="color:var(--red2)">${nm(v.j)}</div>${S.rules.reveal?`<p class="hint" style="margin-bottom:6px">${t('wasRole',{r:t(G.roles[v.j])})}</p>`:''}`;
  else body=`<div class="orb">${IC.scale}</div><div class="res">${t(v.kind==='tie'?'tie':'skipped')}</div>`;

/* win */
function checkWin(lead){
  const a=aliveIdx(),m=a.filter(i=>G.roles[i]==='mafia').length,o=a.length-m;
  let w=null;if(m===0)w='citizens';else if(m>=o)w='mafia';
  if(w){stopTimer();const mn=G.names.filter((n,i)=>G.roles[i]==='mafia');if(w==='mafia')NARR.mafiaWin(mn,lead);else NARR.citizensWin(mn,lead);go('end',{winner:w});return true;}return false;
}

function addLog(v){const id=Date.now();S.log.unshift({id,names:G.names,roles:G.roles,alive:G.alive,winner:G.winner,days:G.day,hist:G.hist,valid:v,ev:G.ev});if(S.log.length>100)S.log.length=100;return id;}
function markGame(v){if(G.logId==null)G.logId=addLog(v);else{const g=S.log.find(x=>x.id===G.logId);if(g)g.valid=v;}G.logValid=v;save();render();}
function finish(to){hush();if(G&&G.mp){if(G.phase==='end'&&G.logId==null)addLog(true);G=null;save();hostBackRoom();V='host';render();window.scrollTo(0,0);return;}if(G&&G.phase==='end'&&G.logId==null)addLog(true);G=null;S.game=null;V=to||'home';save();render();window.scrollTo(0,0);}

const head=(title,right)=>`<div class="top"><button class="pill" aria-label="back" onclick="back()">‹</button><div class="brand"><b>${title}</b></div>${right||''}</div>`;
const won=(g,i)=>g.roles[i]==='mafia'?g.winner==='mafia':g.winner==='citizens';
const fdate=ts=>{try{return new Date(ts).toLocaleString(S.lang==='ar'?'ar':'en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return new Date(ts).toDateString();}};
function stats(){const P={};
  S.log.filter(g=>g.valid).forEach(g=>g.names.forEach((n,i)=>{const k=nkey(n),p=P[k]||(P[k]={name:n,g:0,w:0,mg:0,mw:0,tg:0,tw:0,sv:0,ct:0,fk:0});
    const maf=g.roles[i]==='mafia',w=won(g,i);p.g++;if(w)p.w++;if(maf){p.mg++;if(w)p.mw++;}else{p.tg++;if(w)p.tw++;}
    const e=g.ev||{};if(e.first===i)p.fk++;(e.saves||[]).forEach(x=>{if(x===i)p.sv++;});(e.caught||[]).forEach(x=>{if(+String(x).split(':')[0]===i)p.ct++;});}));
  const all=Object.values(P);all.forEach(p=>{p.q=p.g>=3;p.r=p.w/p.g;});
  const board=all.slice().sort((a,b)=>(b.q-a.q)||(b.r-a.r)||(b.w-a.w)||(b.g-a.g));
  const top=f=>all.filter(p=>f(p)>0).sort((a,b)=>f(b)-f(a))[0]||null;
  const bm=all.filter(p=>p.mg>=2&&p.mw>0).sort((a,b)=>(b.mw/b.mg-a.mw/a.mg)||(b.mw-a.mw))[0]||null;
  return{board,best:board.find(p=>p.q)||null,bestMafia:bm,bestDet:top(p=>p.ct),bestDoc:top(p=>p.sv),firstKilled:top(p=>p.fk)};}

function toggleValid(id){const g=S.log.find(x=>x.id===id);if(g){g.valid=!g.valid;save();render();}}
function statsView(){const st=stats();let h=head(t('statsT'));

function hostStart(){if(needName())return;SND.unlock();S.mpName=S.mpName.trim();save();
  MP.role='host';MP.players={};MP.seq=0;MP.pubAt=0;MP.game=null;

  clearInterval(MP.timer);MP.timer=setInterval(hostTick,250);hostPublish();nav('host');}
function hostTick(){let m,ch=false;const now=Date.now();
  while((m=Net.take())!=null){let o;try{o=JSON.parse(decodeURIComponent(m));}catch(e){continue;}if(!o||!o.id)continue;
    const p=MP.players[o.id];
    if(o.t==='hello'){const nm=String(o.name||'').trim().slice(0,18);
      const taken=!nm||nkey(nm)===nkey(S.mpName)||Object.entries(MP.players).some(([k,q])=>k!==o.id&&nkey(q.name)===nkey(nm));
      if(taken){Net.put('p_'+o.id,JSON.stringify({err:'name'}));continue;}
      if(!p&&MP.game){Net.put('p_'+o.id,JSON.stringify({err:'started'}));continue;}

function mpClientView(g){const key=g.ph+(g.n||g.v||'');if(MP.selKey!==key){MP.selKey=key;MP.sel=null;}
  const sent=MP.sent&&MP.sent.k===(g.ph==='night'?'n'+g.n:g.ph==='vote'?'v'+g.v:'x');
  if(g.ph==='night'&&!sent){let rows=g.opts.map(cOpt).join('');
    if(g.skip)rows+=`<button class="opt skip ${MP.sel==='skip'?'sel':''}" onclick="cpick('skip')"><b>${t('skipKill')}<br><span class="skipleft">${t('skipLeft')}${g.skip.mv?' · '+t('mateVote'):''}</span></b><span class="rad"></span></button>`;
    return `<div class="act"><div class="ah"><span>${esc(S.mpName)}</span><span>${t('night')} ${g.n}</span></div><h2>${t('a_'+g.key)}</h2><p class="d">${t('a_'+g.key+'_d')}</p>
     ${rows?`<div class="list">${rows}</div>`:''}<button class="btn primary" ${g.key!=='none'&&MP.sel===null?'disabled':''} onclick="cconfirm()">${IC.lock.replace('<svg','<svg style="width:20px;height:20px"')}${t('confirm')}</button></div>`;}
  if(g.ph==='vote'&&!sent){let rows=`<button class="opt skip ${MP.sel==='none'?'sel':''}" onclick="cpick('none')"><b>${t('noOne')}</b><span class="rad"></span></button>`+g.opts.map(cOpt).join('');
    return `<div class="act"><div class="ah"><span>${esc(S.mpName)}</span><span>${t('ballot')}</span></div><h2>${t('votePick')}</h2><div style="height:8px"></div><div class="list">${rows}</div>
     <button class="btn primary" ${MP.sel===null?'disabled':''} onclick="cconfirm()">${t('castVote')}</button></div>`;}
  if(g.ph==='night'||g.ph==='nightDone'){let body=`<div class="orb">${IC.lock}</div><div class="res">${t('locked')}</div>`;
    if(g.check)body=`<div class="orb" style="color:${g.check.m?'var(--red2)':'var(--green)'}">${IC.detective}</div><div class="res" style="color:${g.check.m?'var(--red2)':'var(--green)'}">${t(g.check.m?'isMafia':'notMafia',{n:esc(g.check.n)})}</div>`;
    return `<div class="big">${body}<p class="hint" style="margin:0">${g.ph==='nightDone'?t('waitOthersN',{n:t('doneN',{n:g.doneN,m:g.total})}):t('sending')}</p></div>`;}
  if(g.ph==='vote'||g.ph==='voted')return `<div class="big"><div class="orb">${IC.lock}</div><div class="res">${t('voted')}</div><p class="hint" style="margin:0">${g.ph==='voted'?t('waitOthersN',{n:t('votedN',{n:g.doneN,m:g.total})}):t('sending')}</p></div>`;
  if(g.ph==='end'){const w=g.winner;return `<div class="big"><div class="orb">${w==='mafia'?IC.skull:IC.trophy}</div><div class="res" style="font-size:30px;color:${w==='mafia'?'var(--red2)':'var(--gold)'}">${t('win_'+w)}</div></div>
     <div class="sec mt"><div class="sh"><h3>${t('roles')}</h3></div>${g.roster.map((x,j)=>`<div class="endrow">${x.alive?`<span>${esc(x.name)}</span>`:`<s>${esc(x.name)}</s>`}<b style="color:${RC[g.roles[j]]}">${t(g.roles[j])}</b></div>`).join('')}</div>`;}
  const dead=g.ph==='dead';
  return `<div class="big"><div class="chip">${t(LBL[g.label]||'lookHost')}${g.label==='morning'||g.label==='day'?' '+g.day:''}</div>
   ${g.check?`<div class="sec" style="margin-bottom:12px;border-color:${g.check.m?'var(--red2)':'var(--green)'}"><div class="flbl" style="margin-top:0">${t('detective')}</div><b style="font-size:17px;color:${g.check.m?'var(--red2)':'var(--green)'}">${t(g.check.m?'isMafia':'notMafia',{n:esc(g.check.n)})}</b></div>`:''}
   ${dead?`<div class="orb">${IC.skull}</div><p class="hint">${t('youOut')}</p>`:''}${msgHtml(g.msg)||(dead?'':`<div class="orb">${IC.phone}</div><div class="res" style="font-size:20px">${t('lookHost')}</div>`)}${rosterHtml(g)}</div>${dead?'':miniRole(g)}`;}
function clientReady(){const g=MP.room&&MP.room.g;if(!g)return;MP.readyDeal=g.deal;send({t:'ready',deal:g.deal});render();}
function joinView(){const st=MP.status;MP.sig=joinSig();let b='';
  const manual=`<div class="sec mt"><div class="flbl" style="margin-top:0">${t('manual')}</div><div class="prow" style="margin:0"><input id="mip" inputmode="decimal" placeholder="192.168.1.5" value="${esc(S.mpLastHost||'')}" style="direction:ltr"><button class="pill" onclick="joinStart($('mip').value)">${t('connect')}</button></div></div>`;
  if(st==='search')b=`<div class="big"><div class="spin"></div><div class="res" style="font-size:20px">${t('searching')}</div><p class="hint" id="pct" style="margin:0">${t('searchPct',{n:MP.pct})}</p></div>${manual}`;
  else if(st==='nowifi'||st==='notfound')b=`<div class="big"><div class="orb">${IC.phone}</div><p class="hint">${t(st==='nowifi'?'noWifi':'notFound')}</p><button class="btn primary" onclick="joinStart()">${t('tryAgain')}</button></div>${manual}`;
  else if(st==='started')b=`<div class="big"><div class="orb">${IC.lock}</div><p class="hint">${t('started')}</p><button class="btn primary" onclick="joinStart()">${t('tryAgain')}</button></div>`;
  else if(st==='ok'&&MP.room&&MP.room.g&&MP.room.g.ph)b=mpClientView(MP.room.g);
  else if(st==='ok'&&MP.room&&MP.room.g&&MP.readyDeal!==MP.room.g.deal){const g=MP.room.g;b=roleCard(S.mpName,g.role,g.mates,'clientReady()');}
  else if(st==='taken'||st==='full')b=`<div class="big"><div class="orb">${IC.lock}</div><p class="hint">${t(st==='taken'?'nameTaken':'full')}</p><button class="btn primary" onclick="clientStop(true);back()">${t('changeName')}</button></div>`;
  else if(st==='closed')b=`<div class="big"><div class="orb">${IC.lock}</div><p class="hint">${t('closed')}</p><button class="btn primary" onclick="joinStart()">${t('tryAgain')}</button></div>`;
  else{const h=MP.host?esc(MP.host.name):'';
    b=`<div class="big"><div class="chip">${st==='ok'?t('connected',{n:h}):st==='lost'?t('lost'):t('joining',{n:h})}</div><div class="who" style="font-size:28px">${esc(S.mpName)}</div>
     <p class="hint" id="lat" style="margin:0">${st==='ok'?t('lat',{n:MP.lat}):''}</p></div>
     ${MP.room?`<div class="sec mt"><div class="sh"><h3>${t('playersIn',{n:MP.room.players.length})}</h3></div>${roomList(MP.room.players)}</div>`:''}
     ${st==='ok'&&MP.room&&MP.room.g?`<div class="big mt"><div class="res" style="font-size:20px">${t('youReady')}</div><p class="hint" style="margin:0">${t('waitOthers')} ${t('readyN',{n:MP.room.g.readyN,m:MP.room.g.total})}</p></div>`
       :st==='ok'?`<p class="mpinfo" style="text-align:center;margin:4px 0 12px">${t('waitDeal')}</p><button class="btn primary" onclick="send({t:'buzz'});toast(t('buzzSent'))">${t('buzzHost')}</button>`:''}`;}
  return head(t('join'))+b+`<button class="danger" onclick="back()">${t('leave')}</button>`;}

/* ---------- shell ---------- */
const stage=inner=>`<div class="stage">${inner}</div>`;
function render(){
  let h;
  if(!G)h=V==='setup'?setupView():V==='history'?historyView():V==='stats'?statsView():V==='guide'?guideView():V==='mp'?mpView():V==='host'?hostView():V==='join'?joinView():V.indexOf('game:')===0?gameView(+V.slice(5)):homeView();
  else{
    const v={mpNight:mpNightView,mpVote:mpVoteView,deal:dealView,nightPass:nightPassView,nightAct:nightActView,nightDone:nightDoneView,dawn:dawnView,morning:morningView,day:dayView,ballotPass:ballotPassView,ballotAct:ballotActView,verdict:verdictView,end:endView}[G.phase];
    h=v();
    if(G.phase!=='end'&&!(['morning','verdict'].includes(G.phase)&&!G.revealed))h+=`<div class="footer">${t('round')} ${G.day} · ${aliveIdx().length}/${G.names.length} ${t('alive')}</div>`;
  }
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const ph=G?G.phase:'';let th='';
  if(['nightPass','nightAct','nightDone','dawn','mpNight'].includes(ph))th='night';else if(['day','ballotPass','ballotAct','mpVote'].includes(ph)||(ph==='morning'&&G.revealed&&G.morning==null)||(ph==='verdict'&&G.revealed&&G.verdict.j==null))th='day';
  else if((ph==='morning'||ph==='verdict')&&G.revealed)th='blood';else if(ph==='morning'||ph==='verdict')th=ph==='morning'?'day':'';
  else if(ph==='end'&&G.revealed)th=G.winner==='mafia'?'blood':'glory';
  document.body.className=th;
  const key=G?ph+'|'+G.i+'|'+G.day+'|'+G.revealed+'|'+G.mode+'|'+G.logId:'v:'+V;const app=$('app');
  app.classList.toggle('anim',key!==render.last);render.last=key;
  app.innerHTML=h;
  if(G&&['morning','verdict','end'].includes(ph)&&!G.revealed&&!revealTimer)arm(1.5);
  if($('hold'))bindHold();
}
function showQuit(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)keepPlaying()"><div class="sheet"><h3>${t('quitQ')}</h3><p>${t(G&&G.mp?'quitMp':'quitD')}</p>
  <button class="btn ghost" onclick="keepPlaying()">${t('keep')}</button><button class="btn primary mt" onclick="quitGame()">${t('quit')}</button></div></div>`;
}
function keepPlaying(){$('modal').innerHTML='';enterGame();}
function quitGame(){hush();$('modal').innerHTML='';if(G&&G.mp){stopTimer();G=null;hostBackRoom();V='host';render();return;}stopTimer();save();G=null;resumeOffer=!!S.game;V='home';render();}
window.addEventListener('popstate',()=>{if(G){if(G.phase==='end'){finish();return;}showQuit();}else if(V!=='home')popNav();});
render();
</script>
